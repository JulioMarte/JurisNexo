services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: jurisnexo
      POSTGRES_USER: jurisnexo
      POSTGRES_PASSWORD: jurisnexo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jurisnexo -d jurisnexo"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - jurisnexo-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: ./backend
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://jurisnexo:jurisnexo@db:5432/jurisnexo
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://jurisnexo:jurisnexo@db:5432/jurisnexo
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  test:
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql://jurisnexo:jurisnexo@db:5432/jurisnexo
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["test"]

volumes:
  jurisnexo-postgres:
