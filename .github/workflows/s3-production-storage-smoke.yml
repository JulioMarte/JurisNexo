name: S3 production storage smoke

on:
  workflow_dispatch:
  push:
    branches:
      - hardening/dedicated-s3-smoke

permissions:
  contents: read

concurrency:
  group: s3-production-storage-smoke
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
  JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
  JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
  JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
  JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
  JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}

jobs:
  smoke:
    name: Validate configured production S3 storage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate required S3 configuration without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in JURISNEXO_S3_BUCKET JURISNEXO_S3_ENDPOINT_URL JURISNEXO_S3_REGION JURISNEXO_S3_ACCESS_KEY_ID JURISNEXO_S3_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required S3 secrets: %s\n' "${missing[*]}" >&2
            exit 2
          fi
          case "$JURISNEXO_S3_ENDPOINT_URL" in
            https://*) ;;
            *)
              echo 'JURISNEXO_S3_ENDPOINT_URL must be an absolute HTTPS URL such as https://s3.us-east-005.backblazeb2.com.' >&2
              exit 2
              ;;
          esac
          if [[ "$JURISNEXO_S3_REGION" == *"://"* || "$JURISNEXO_S3_REGION" == */* ]]; then
            echo 'JURISNEXO_S3_REGION must contain only the provider region identifier, not an endpoint URL.' >&2
            exit 2
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install backend and pinned S3 runtime
        run: python -m pip install -e ./backend 'boto3==1.43.93'
      - name: Probe configured S3 object store
        env:
          JURISNEXO_S3_SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m jurisnexo.acquisition.s3_smoke
