name: SCJ Principales Ling literal OCR

on:
  pull_request:
    branches: [development]
    paths:
      - ".github/workflows/scj-principales-ling-literal-ocr.yml"
      - "backend/scripts/scj_ling_literal_ocr.py"
      - "backend/tests/unit/test_scj_ling_literal_ocr.py"
      - "docs/44-scj-principales-verified-corpus-census.md"
  push:
    branches: [development]
    paths:
      - ".github/paid-runs/scj-principales-ling-15900.json"
  workflow_dispatch:
    inputs:
      run_paid:
        description: Run Ling inference after freezing the inventory
        required: true
        default: false
        type: boolean
      max_pages_per_worker:
        description: Canary total-page limit; 0 means the full frozen plan
        required: true
        default: "0"
        type: string
      confirm_paid_run:
        description: Type RUN_15900_PAGES when run_paid is true
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: scj-principales-ling-literal-ocr
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Require explicit manual paid-run confirmation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_paid }}
        run: test '${{ inputs.confirm_paid_run }}' = 'RUN_15900_PAGES'
      - name: Validate push paid-run authorization
        if: ${{ github.event_name == 'push' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(
              Path(".github/paid-runs/scj-principales-ling-15900.json")
              .read_text(encoding="utf-8")
          )
          expected = {
              "enabled": True,
              "model": "inclusionai/ling-3.0-flash-vl",
              "provider": "NovitaAI",
              "pages": 15900,
              "documents": 36,
              "passes": 2,
              "workers": 20,
              "confirm": "RUN_15900_PAGES",
          }
          if request != expected:
              raise SystemExit(
                  "Paid-run authorization file does not exactly match "
                  "the approved 15,900-page Ling benchmark contract."
              )
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install contract runtime
        run: |
          python -m pip install -e ./backend pytest==9.1.1 ruff==0.16.7 \
            "pypdfium2==5.13.0" "pillow==12.3.0"
      - name: Validate Ling OCR contract
        run: |
          python -m py_compile backend/scripts/scj_ling_literal_ocr.py
          ruff check \
            backend/scripts/scj_ling_literal_ocr.py \
            backend/tests/unit/test_scj_ling_literal_ocr.py
          pytest -q backend/tests/unit/test_scj_ling_literal_ocr.py

  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    needs: contract
    runs-on: ubuntu-24.04
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          python -m pip install -e ./backend "boto3==1.43.93" \
            "pypdfium2==5.13.0" "pillow==12.3.0"
      - name: Freeze unresolved-page plan from durable census
        run: |
          mkdir -p "$RUNNER_TEMP/ling-plan"
          python backend/scripts/scj_ling_literal_ocr.py plan \
            --output "$RUNNER_TEMP/ling-plan"
          python - "$RUNNER_TEMP/ling-plan/plan.json" <<'PY'
          import json
          import sys

          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          counts = plan["counts"]
          print(f"Target documents: {counts['total_documents']}")
          print(f"Target pages: {counts['total_pages']}")
          print(f"Misaligned: {counts.get('misaligned', 0)}")
          print(f"No native text: {counts.get('no_native_text', 0)}")
          if counts["total_documents"] != 36:
              raise SystemExit(
                  "Frozen census must cover exactly 36 SCJ Principales decisions; "
                  f"found {counts['total_documents']}."
              )
          if counts["total_pages"] != 15900:
              raise SystemExit(
                  "Frozen census target changed from expected 15,900 pages; "
                  "review before spending."
              )
          if plan["model"] != "inclusionai/ling-3.0-flash-vl":
              raise SystemExit(f"Unexpected model: {plan['model']}")
          if plan["provider"] != "NovitaAI":
              raise SystemExit(f"Unexpected provider: {plan['provider']}")
          if plan["passes"] != 2:
              raise SystemExit(f"Unexpected pass count: {plan['passes']}")
          if plan["worker_count"] != 20:
              raise SystemExit(f"Unexpected worker count: {plan['worker_count']}")
          PY
      - name: Publish frozen plan summary
        run: |
          python - "$RUNNER_TEMP/ling-plan/plan.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          print("## Ling literal OCR frozen plan")
          print()
          print(f"- Decisions/documents: **{plan['counts']['total_documents']} / 36**")
          print(f"- Pages requiring Ling recovery: **{plan['counts']['total_pages']}**")
          print(f"- Model: **{plan['model']}**")
          print(f"- Provider: **{plan['provider']}**")
          print(f"- Passes: **{plan['passes']}**")
          print(f"- Dynamic workers per PDF: **{plan['worker_count']}**")
          print(f"- Plan SHA-256: {plan['plan_sha256']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scj-ling-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ling-plan/plan.json
          retention-days: 90

  ocr:
    if: ${{ github.event_name == 'push' || inputs.run_paid }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: scj-ling-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ling-plan
      - run: |
          python -m pip install -e ./backend "boto3==1.43.93" \
            "pypdfium2==5.13.0" "pillow==12.3.0"
      - name: Run 20-worker dynamic PDF queue
        env:
          MAX_PAGES: ${{ github.event_name == 'push' && '0' || inputs.max_pages_per_worker }}
        run: |
          mkdir -p "$RUNNER_TEMP/ling-worker"
          python backend/scripts/scj_ling_literal_ocr.py worker \
            --plan "$RUNNER_TEMP/ling-plan/plan.json" \
            --worker-index '0' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --max-pages "$MAX_PAGES" \
            --output "$RUNNER_TEMP/ling-worker"
      - uses: actions/upload-artifact@v4
        with:
          name: scj-ling-worker-pool-${{ github.run_id }}
          path: ${{ runner.temp }}/ling-worker/**
          if-no-files-found: error
          retention-days: 90

  aggregate:
    if: ${{ github.event_name == 'push' || (inputs.run_paid && inputs.max_pages_per_worker == '0') }}
    needs: [plan, ocr]
    runs-on: ubuntu-24.04
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: scj-ling-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ling-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: scj-ling-worker-*-${{ github.run_id }}
          path: ${{ runner.temp }}/ling-workers
          merge-multiple: false
      - run: |
          python -m pip install -e ./backend "boto3==1.43.93" \
            "pypdfium2==5.13.0" "pillow==12.3.0"
      - name: Reconcile every page and calculate exact cost
        run: |
          mkdir -p "$RUNNER_TEMP/ling-summary"
          python backend/scripts/scj_ling_literal_ocr.py aggregate \
            --plan "$RUNNER_TEMP/ling-plan/plan.json" \
            --worker-root "$RUNNER_TEMP/ling-workers" \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --output "$RUNNER_TEMP/ling-summary"
      - name: Publish final OCR and cost report
        run: cat "$RUNNER_TEMP/ling-summary/summary.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: scj-ling-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/ling-summary/**
          retention-days: 90

  canary-summary:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_paid && inputs.max_pages_per_worker != '0' }}
    needs: [plan, ocr]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: scj-ling-worker-*-${{ github.run_id }}
          path: ${{ runner.temp }}/ling-workers
          merge-multiple: false
      - name: Publish exact canary cost
        run: |
          python - "$RUNNER_TEMP/ling-workers" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          rows = [
              json.load(open(path, encoding="utf-8"))
              for path in sorted(root.rglob("worker-*.json"))
          ]
          total = sum(float(row["charged_this_run_usd"]) for row in rows)
          completed = sum(int(row["newly_completed_pages"]) for row in rows)
          restored = sum(int(row["restored_pages"]) for row in rows)
          print("## Ling OCR canary")
          print()
          print(f"- Worker summaries: **{len(rows)}**")
          print(f"- Newly completed pages: **{completed}**")
          print(f"- Restored pages: **{restored}**")
          print(f"- Exact billed cost this run: **${total:.10f}**")
          PY
