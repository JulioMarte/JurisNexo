name: SCJ Principales PDF-aware production holdout

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - development
    paths:
      - "benchmark/normalization/evaluate_scj_principales_pdf_policy_holdout.py"
      - "backend/src/jurisnexo/normalization/adapters/docling.py"
      - "backend/src/jurisnexo/normalization/gold.py"
      - "backend/src/jurisnexo/normalization/quality.py"
      - ".github/workflows/scj-principales-pdf-policy-holdout.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scj-principales-pdf-policy-holdout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  holdout:
    if: contains(github.event.pull_request.labels.*.name, 'normalization-holdout')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
      SCJ_PDF_POLICY_HOLDOUT_CASES: "6"
      SCJ_PDF_POLICY_HOLDOUT_MIN_REFERENCE_CHARS: "800"
      SCJ_PDF_POLICY_HOLDOUT_MAX_PAGES_TO_SCAN: "120"
      SCJ_PDF_POLICY_HOLDOUT_MAX_DOCUMENTS: "40"
      SCJ_PDF_POLICY_MAX_HOLDOUT_MEAN_WER: "0.10"
      SCJ_PDF_POLICY_MIN_HOLDOUT_CONTENT_RECALL: "0.98"
      SCJ_PDF_POLICY_MIN_HOLDOUT_CONTENT_PRECISION: "0.98"
      SCJ_PDF_POLICY_MIN_HOLDOUT_CRITICAL_RECALL: "1.0"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install production-policy benchmark runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend \
            "boto3==1.43.93" \
            "docling==2.129.0" \
            "pypdf==6.19.0" \
            "pypdfium2==5.13.0"

      - name: Run PDF-aware calibration and holdout
        env:
          SCJ_PDF_POLICY_HOLDOUT_OUTPUT: ${{ runner.temp }}/pdf-policy-holdout/results.json
        run: |
          python benchmark/normalization/evaluate_scj_principales_pdf_policy_holdout.py

      - name: Preserve production-policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-principales-pdf-policy-holdout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pdf-policy-holdout/**
          if-no-files-found: warn
          retention-days: 30
