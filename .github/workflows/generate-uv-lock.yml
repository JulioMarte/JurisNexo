name: Generate uv lock

on:
  push:
    branches: [chore/uv-lock]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.4"
      - name: Generate lockfile
        working-directory: backend
        run: uv lock
      - name: Validate frozen sync
        working-directory: backend
        run: uv sync --frozen --group dev
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- backend/uv.lock && git ls-files --error-unmatch backend/uv.lock >/dev/null 2>&1; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git commit -m "lock backend Python dependencies"
          git push origin HEAD:chore/uv-lock
