name: SCJ live backfill canary

on:
  push:
    branches:
      - acquisition/scj-live-backfill-observability
    paths:
      - '.github/workflows/scj-backfill-canary.yml'
      - 'backend/scripts/scj_backfill_canary.py'
      - 'backend/src/jurisnexo/acquisition/**'
      - 'backend/src/jurisnexo/corpus/artifact_catalog.py'
      - 'backend/src/jurisnexo/corpus/artifact_inventory.py'
      - 'backend/src/jurisnexo/observability.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      SCJ_CANARY_LIMIT: '3'
      SCJ_CANARY_OUTPUT: ${{ runner.temp }}/scj-canary-output
    steps:
      - uses: actions/checkout@v6
      - name: Validate live configuration without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in DATABASE_URL JURISNEXO_S3_BUCKET JURISNEXO_S3_ENDPOINT_URL JURISNEXO_S3_REGION JURISNEXO_S3_ACCESS_KEY_ID JURISNEXO_S3_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 2
          fi
          echo 'Live database and S3 configuration is present.'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned live-backfill runtime
        run: >-
          python -m pip install
          -e ./backend
          'boto3==1.43.93'
          'playwright==1.62.0'
          'opentelemetry-sdk==1.44.0'
          'opentelemetry-exporter-otlp-proto-http==1.44.0'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Acquire and verify three live SCJ PDFs
        run: python backend/scripts/scj_backfill_canary.py 2>&1 | tee scj-canary-otel.log
      - name: Upload canary evidence and OpenTelemetry output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-backfill-canary-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/scj-canary-output/**
            scj-canary-otel.log
