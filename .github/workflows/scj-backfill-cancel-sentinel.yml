name: Cancel stale SCJ backfill

on:
  push:
    branches:
      - feature/acquisition-run-manifests
    paths:
      - '.github/workflows/scj-backfill-cancel-sentinel.yml'

permissions:
  contents: read

concurrency:
  group: scj-1994-full-storage-backfill
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Superseding stale automatic SCJ production backfill run."
