name: Ling OCR Luna Decisions audit 100

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ling-luna-decisions-audit-100-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install benchmark runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend "boto3==1.43.93" "pypdfium2==5.13.0" "pillow==12.3.0"
      - name: Compile benchmark
        run: python -m py_compile backend/scripts/benchmark_ling_luna_decisions_audit.py
      - name: Run 100-page live audit
        run: |
          python backend/scripts/benchmark_ling_luna_decisions_audit.py --output "$RUNNER_TEMP/audit"
      - name: Publish summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/audit/summary.md"; then
            cat "$RUNNER_TEMP/audit/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ling-luna-decisions-audit-100-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/audit/**
          if-no-files-found: warn
          retention-days: 30
