name: SCJ Principales OpenRouter smoke

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - development
    paths:
      - "backend/scripts/scj_principales_openrouter_smoke.py"
      - "benchmark/normalization/scj_page_selection.py"
      - "backend/src/jurisnexo/model_providers/openrouter_decisions.py"
      - ".github/workflows/scj-principales-openrouter-smoke.yml"

permissions:
  contents: read

concurrency:
  group: scj-principales-openrouter-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: contains(github.event.pull_request.labels.*.name, 'live-provider-smoke')
    name: Two Principales / three model calls max
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
      SCJ_PRINCIPALES_OPENROUTER_LIMIT: "2"
      SCJ_PRINCIPALES_OPENROUTER_TEXT_CHARS: "5000"
      SCJ_PRINCIPALES_OPENROUTER_MAX_COST_USD: "0.01"
      JURISNEXO_OPENROUTER_JEV_MODEL: "~typesafe/jev-latest"
      JURISNEXO_OPENROUTER_DEEPSEEK_REASONING_EFFORT: "high"
      JURISNEXO_OPENROUTER_DEEPSEEK_MODEL: "deepseek/deepseek-v4.1-flash"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install isolated normalization runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend "boto3==1.43.93" "docling==2.129.0" "pypdf==6.19.0" "pypdfium2==5.13.0"

      - name: Assert live-test secret exists
        run: |
          test -n "$OPENROUTER_API_KEY" || {
            echo "OPENROUTER_API_KEY is not configured"
            exit 1
          }

      - name: Run bounded Principales smoke
        env:
          SCJ_PRINCIPALES_OPENROUTER_OUTPUT: ${{ runner.temp }}/principales-openrouter
        run: |
          python backend/scripts/scj_principales_openrouter_smoke.py

      - name: Preserve cost and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-principales-openrouter-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/principales-openrouter/**
          if-no-files-found: warn
          retention-days: 30
