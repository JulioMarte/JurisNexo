name: Engineering quality signals

on:
  pull_request:
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signals:
    name: Architecture diff and maintainability signals
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build backend quality environment
        run: docker compose --profile test build test
      - name: Build engineering quality evidence
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          QUALITY_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALITY_EVENT_NAME: ${{ github.event_name }}
        run: |
          base_ref="$QUALITY_BASE_REF"
          if [ -z "$base_ref" ] || ! git cat-file -e "$base_ref^{commit}" 2>/dev/null; then
            base_ref="HEAD^"
          fi
          if [ "$QUALITY_EVENT_NAME" = "pull_request" ]; then
            test_mode="PR_MERGE"
          else
            test_mode="BRANCH_HEAD"
          fi
          docker compose --profile test run --rm --no-deps \
            -v "$PWD:/repo" \
            -w /repo/backend \
            -e QUALITY_SOURCE_HEAD_SHA="$QUALITY_SOURCE_HEAD_SHA" \
            -e QUALITY_TEST_MODE="$test_mode" \
            test sh -ec '
              python /repo/backend/scripts/ci/build_engineering_quality_report.py \
                --repo-root /repo \
                --base-ref "$1" \
                --output /repo/.ci/engineering-quality.json
              python /repo/backend/scripts/ci/build_architecture_diff.py \
                --repo-root /repo \
                --base-ref "$1" \
                --output /repo/.ci/architecture-diff.json
            ' sh "$base_ref"
      - name: Upload engineering quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: engineering-quality-${{ github.sha }}
          path: |
            .ci/engineering-quality.json
            .ci/architecture-diff.json
          if-no-files-found: error
          retention-days: 14
