name: Normalization live evidence persistence

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    branches:
      - development
    paths:
      - "backend/scripts/normalization_live_evidence_smoke.py"
      - "backend/src/jurisnexo/normalization/**"
      - "backend/src/jurisnexo/model_providers/openrouter_decisions.py"
      - "backend/src/jurisnexo/model_providers/decisions.py"
      - "backend/src/jurisnexo/bootstrap/settings.py"
      - ".github/workflows/normalization-live-evidence-smoke.yml"

permissions:
  contents: read

concurrency:
  group: normalization-live-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-evidence:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'live-evidence-persistence'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JURISNEXO_OPENROUTER_JEV_MODEL: "~typesafe/jev-latest"
      NORMALIZATION_LIVE_EVIDENCE_MAX_COST_USD: "0.005"
    steps:
      - uses: actions/checkout@v6

      - name: Assert explicit live-provider secret
        run: |
          test -n "$OPENROUTER_API_KEY" || {
            echo "OPENROUTER_API_KEY is not configured"
            exit 1
          }

      - name: Build backend test image
        run: docker compose --profile test build test

      - name: Validate live smoke before spending provider credits
        run: |
          docker compose --profile test run --rm --no-deps \
            -v "$PWD:/repo:ro" \
            test ruff check /repo/backend/scripts/normalization_live_evidence_smoke.py
          docker compose --profile test run --rm --no-deps \
            -v "$PWD:/repo:ro" \
            test python -m py_compile /repo/backend/scripts/normalization_live_evidence_smoke.py

      - name: Start PostgreSQL, migrate and bootstrap
        run: |
          docker compose up -d db
          docker compose run --rm migrate
          docker compose run --rm bootstrap

      - name: Run live provider to durable evidence smoke
        run: |
          mkdir -p "$RUNNER_TEMP/normalization-live-evidence"
          docker compose --profile test run --rm --no-deps \
            -e OPENROUTER_API_KEY \
            -e NORMALIZATION_LIVE_EVIDENCE_MAX_COST_USD \
            -e NORMALIZATION_LIVE_EVIDENCE_OUTPUT=/artifacts/results.json \
            -v "$PWD:/repo:ro" \
            -v "$RUNNER_TEMP/normalization-live-evidence:/artifacts" \
            test python /repo/backend/scripts/normalization_live_evidence_smoke.py

      - name: Preserve durable live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normalization-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/normalization-live-evidence/**
          if-no-files-found: error
          retention-days: 90

      - name: Show database state on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color db migrate

      - name: Tear down
        if: always()
        run: docker compose --profile test down -v --remove-orphans
