name: SCJ Principales two-pass Ling OCR
on:
  workflow_dispatch:
    inputs:
      census_prefix:
        description: Exact completed census prefix; required if more than one generation exists
        required: false
        default: ""
        type: string
      inventory_only:
        description: Discover/freeze pending pages without paid inference
        required: true
        default: true
        type: boolean
      max_cost_usd:
        description: Cost cap checked between 20-page batches
        required: true
        default: "50.00"
        type: string
      max_new_pages:
        description: Strict canary page cap; 0 means all pending pages
        required: true
        default: "0"
        type: string
permissions:
  contents: read
concurrency:
  group: scj-principales-ling-ocr
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          python -m pip install -e ./backend pytest==9.1.1 ruff==0.16.7 "pypdfium2==5.13.0"
          python -m py_compile backend/scripts/scj_principales_ling_ocr.py
          ruff check backend/scripts/scj_principales_ling_ocr.py backend/tests/unit/test_scj_principales_ling_ocr.py
          pytest -q backend/tests/unit/test_scj_principales_ling_ocr.py
  inventory:
    needs: contract
    runs-on: ubuntu-24.04
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ./backend "boto3==1.43.93" "pypdfium2==5.13.0"
      - name: Freeze exact pending-page inventory
        shell: bash
        run: |
          args=(inventory --output "$RUNNER_TEMP/inventory.json")
          if [ -n '${{ inputs.census_prefix }}' ]; then args+=(--census-prefix '${{ inputs.census_prefix }}'); fi
          python backend/scripts/scj_principales_ling_ocr.py "${args[@]}"
      - name: Publish inventory summary
        run: |
          python - "$RUNNER_TEMP/inventory.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print("## Ling OCR pending-page inventory")
          print(f"- Census: {d['census_prefix']}")
          print(f"- PDFs with pending pages: {d['document_count']}")
          print(f"- Pending pages: {d['pending_page_count']}")
          print(f"- Model: {d['model']}")
          print(f"- Provider: {d['provider']} (fallback disabled)")
          print(f"- Passes: {d['passes']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scj-ling-ocr-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/inventory.json
          retention-days: 90
  ling-ocr:
    if: ${{ !inputs.inventory_only }}
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 2160
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ./backend "boto3==1.43.93" "pypdfium2==5.13.0" "pillow==12.3.0"
      - uses: actions/download-artifact@v4
        with:
          name: scj-ling-ocr-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/ling
      - name: Run resumable two-pass OCR
        shell: bash
        run: |
          args=(run --inventory "$RUNNER_TEMP/ling/inventory.json" --output "$RUNNER_TEMP/ling/summary.json" --max-cost-usd '${{ inputs.max_cost_usd }}')
          if [ '${{ inputs.max_new_pages }}' -gt 0 ]; then args+=(--max-new-pages '${{ inputs.max_new_pages }}'); fi
          python backend/scripts/scj_principales_ling_ocr.py "${args[@]}"
      - name: Publish model provider and exact new-call cost
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ling/summary.json" ]; then
            cat "$RUNNER_TEMP/ling/summary.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scj-ling-ocr-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/ling/**
          retention-days: 90
