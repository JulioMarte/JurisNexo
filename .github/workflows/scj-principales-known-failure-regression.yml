name: SCJ Principales known-failure regression

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - development
    paths:
      - "benchmark/normalization/principales_failed_page_diagnostics.py"
      - "benchmark/normalization/principales_failed_pages.json"
      - "benchmark/normalization/principales_corpus_suite.py"
      - "backend/src/jurisnexo/normalization/adapters/docling.py"
      - "backend/src/jurisnexo/normalization/gold.py"
      - "backend/src/jurisnexo/normalization/quality.py"
      - ".github/workflows/scj-principales-known-failure-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scj-principales-known-failure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'normalization-readiness')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
      FAILURE_DIAGNOSTIC_REQUIRE_PASS: "1"
      FAILURE_DIAGNOSTIC_MAX_WER: "0.10"
      FAILURE_DIAGNOSTIC_MIN_CONTENT_RECALL: "0.98"
      FAILURE_DIAGNOSTIC_MIN_CRITICAL_RECALL: "1.0"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install regression runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend \
            "boto3==1.43.93" \
            "docling==2.129.0" \
            "pypdf==6.19.0" \
            "pypdfium2==5.13.0" \
            "pillow==12.3.0"

      - name: Re-run known legal-critical failure pages
        env:
          FAILURE_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/known-failure-regression
        run: |
          python benchmark/normalization/principales_failed_page_diagnostics.py

      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-principales-known-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/known-failure-regression/**
          if-no-files-found: error
          retention-days: 90
