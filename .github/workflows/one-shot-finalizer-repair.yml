        parsed = _ExtractionAuditFinalizationArgs.model_validate_json(input_json)
        return _finalize_extraction_audit_impl(ctx, parsed.audit)
    except (ValueError, DocumentEnvironmentError) as exc:
        return _extraction_audit_finalization_error_feedback(ctx, exc)


finalize_extraction_audit = FunctionTool(
    name="finalize_extraction_audit",
    description=(
        "Finalize the extraction audit after deterministic source validation. "
        "If rejected, repair only this payload and call the tool again."
    ),
    params_json_schema=_ExtractionAuditFinalizationArgs.model_json_schema(),
    on_invoke_tool=_invoke_finalize_extraction_audit,
    strict_json_schema=True,
