def build_extraction_auditor''',
          )
          replace_once(
              extraction_auditor,
              '        tool_use_behavior=StopAtTools(stop_at_tool_names=["finalize_extraction_audit"]),\n',
              '        tool_use_behavior=_extraction_audit_tool_use_behavior,\n',
          )

          test_path = 'backend/tests/unit/test_structure_finalization_repair.py'
          replace_once(
              test_path,
              '    _document_tool_error_feedback,\n    _scope_reminder,\n    _structure_finalization_error_feedback,\n)',
              '    StructureAgentContext,\n    _document_tool_error_feedback,\n    _scope_reminder,\n    _structure_finalization_error_feedback,\n    _structure_tool_use_behavior,\n    finalize_structure_hypothesis,\n)',
          )
          p = Path(test_path)
          text = p.read_text()
          marker = '\n\ndef test_structure_finalization_repair_is_bounded() -> None:\n'
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          test = '''\n\n@pytest.mark.asyncio\nasync def test_raw_malformed_structure_finalizer_json_is_repairable_before_sdk_parsing() -> None:\n    context = StructureAgentContext(environment=DocumentEnvironment(pages=("page one",)))\n    wrapper = cast(Any, SimpleNamespace(context=context))\n\n    feedback = await finalize_structure_hypothesis.on_invoke_tool(\n        wrapper,\n        '{"hypothesis":',\n    )\n\n    assert "FINALIZATION_REJECTED" in str(feedback)\n    assert context.finalized_output == []\n    behavior = _structure_tool_use_behavior(wrapper, [])\n    assert behavior.is_final_output is False\n    assert len(context.finalization_errors) == 1\n\n'''
          p.write_text(text.replace(marker, test + marker, 1))
          PY

          git diff --check
          git status --short

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JurisNexo CI repair'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/jurisnexo/ingestion/sdk_structure_agent.py \
                  backend/src/jurisnexo/ingestion/sdk_structure_auditor.py \
                  backend/src/jurisnexo/ingestion/sdk_extraction_agent.py \
                  backend/src/jurisnexo/ingestion/sdk_extraction_auditor.py \
                  backend/tests/unit/test_structure_finalization_repair.py
          git commit -m 'Repair raw finalizer JSON handling'
          git push origin HEAD:ingestion/structure-agent-adversarial-trace
