          )
          replace_once(
              extraction,
              '        tool_use_behavior=StopAtTools(stop_at_tool_names=["finalize_extraction_annotations"]),\n',
              '        tool_use_behavior=_extraction_tool_use_behavior,\n',
          )

          extraction_auditor = 'backend/src/jurisnexo/ingestion/sdk_extraction_auditor.py'
          replace_once(
              extraction_auditor,
              'from agents import Agent, ModelSettings, RunConfig, RunContextWrapper, Runner\nfrom agents.agent import StopAtTools\n',
              'from agents import (\n    Agent,\n    FunctionTool,\n    FunctionToolResult,\n    ModelSettings,\n    RunConfig,\n    RunContextWrapper,\n    Runner,\n)\nfrom agents.agent import ToolsToFinalOutputResult\n',
          )
          replace_once(
              extraction_auditor,
              'from agents.decorators import tool\nfrom pydantic import BaseModel, ConfigDict, Field, model_validator\n',
              'from agents.decorators import tool\nfrom agents.tool_context import ToolContext\nfrom pydantic import BaseModel, ConfigDict, Field, model_validator\n',
          )
          regex_once(
              extraction_auditor,
              r'@tool\(failure_error_function=_extraction_audit_finalization_error_feedback, strict_mode=True\)\ndef finalize_extraction_audit\(.*?\n\n\ndef build_extraction_auditor',
              '''class _ExtractionAuditFinalizationArgs(BaseModel):
    model_config = ConfigDict(extra="forbid")

    audit: ExtractionAuditResult


def _finalize_extraction_audit_impl(
    ctx: RunContextWrapper[ExtractionAuditorContext], audit: ExtractionAuditResult
) -> str:
    if ctx.context.finalized_output:
        raise RuntimeError("extraction audit was already finalized")
    validate_extraction_audit_evidence(audit=audit, environment=ctx.context.environment)
    ctx.context.finalized_output.append(audit)
    return audit.model_dump_json()


async def _invoke_finalize_extraction_audit(
    ctx: ToolContext[ExtractionAuditorContext], input_json: str
