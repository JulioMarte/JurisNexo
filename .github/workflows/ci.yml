name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-database:
    name: Backend database contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build backend test image
        run: docker compose --profile test build test
      - name: Start database and apply migrations
        run: docker compose up -d db && docker compose run --rm migrate
      - name: Run backend schema contract tests
        run: >-
          docker compose --profile test run --rm
          -v "$PWD:/repo:ro"
          -e JURISNEXO_REPO_ROOT=/repo
          -e GITHUB_BASE_REF
          -e GITHUB_HEAD_REF
          test pytest -q
      - name: Show service state on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color db migrate
      - name: Tear down
        if: always()
        run: docker compose --profile test down -v --remove-orphans

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build backend test image
        run: docker compose --profile test build test
      - name: Ruff
        run: docker compose --profile test run --rm --no-deps test ruff check src tests migrations
      - name: Architecture fitness functions
        run: >-
          docker compose --profile test run --rm --no-deps
          -v "$PWD:/repo:ro"
          -e JURISNEXO_REPO_ROOT=/repo
          -e GITHUB_BASE_REF
          -e GITHUB_HEAD_REF
          test pytest tests/architecture
      - name: Acquisition unit contracts
        run: >-
          docker compose --profile test run --rm --no-deps
          test pytest
          tests/unit/test_acquisition_http_fetcher.py
          tests/unit/test_official_corpus_acquisition.py
          tests/unit/test_acquisition_manifest.py
          tests/unit/test_acquisition_recovery.py
      - name: Ruff ingestion benchmark runners
        run: >-
          docker compose --profile test run --rm --no-deps
          -v "$PWD/benchmark:/benchmark:ro"
          test ruff check /benchmark/ingestion
      - name: Historical benchmark scorer smoke test
        run: |
          docker compose --profile test run --rm --no-deps \
            -v "$PWD/benchmark:/benchmark:ro" \
            test sh -ec '
              python /benchmark/ingestion/evaluate_historical_bulletin_agent.py \
                --result /benchmark/ingestion/fixtures/historical_agent_score.pass.json \
                --gold /benchmark/ingestion/gold/historical_bulletin_831_index.v1.json \
                --sha256 /benchmark/ingestion/fixtures/historical_agent_score.sha256.txt \
                --output /tmp/historical-agent-score.json
              python -c "import json; p=json.load(open(\"/tmp/historical-agent-score.json\")); assert p[\"status\"] == \"PASS\"; assert p[\"semantic_status\"] == \"PASS\"; assert p[\"metrics\"][\"verified_gold_reference_count\"] == 3; assert p[\"semantic_metrics\"][\"confirmed_gold_reference_count\"] == 3"
              python /benchmark/ingestion/evaluate_historical_bulletin_agent.py \
                --result /benchmark/ingestion/fixtures/historical_agent_score.unsupported_semantic.json \
                --gold /benchmark/ingestion/gold/historical_bulletin_831_index.v1.json \
                --sha256 /benchmark/ingestion/fixtures/historical_agent_score.sha256.txt \
                --output /tmp/historical-agent-score-unsupported.json
              python -c "import json; p=json.load(open(\"/tmp/historical-agent-score-unsupported.json\")); assert p[\"status\"] == \"PASS\"; assert p[\"semantic_status\"] == \"FAIL\"; assert p[\"semantic_metrics\"][\"confirmed_gold_reference_count\"] == 2; assert p[\"semantic_metrics\"][\"investigations\"][2][\"trace_supported\"] is False"
              python /benchmark/ingestion/evaluate_historical_bulletin_agent.py \
                --result /benchmark/ingestion/fixtures/historical_agent_score.delegated.json \
                --gold /benchmark/ingestion/gold/historical_bulletin_831_index.v1.json \
                --sha256 /benchmark/ingestion/fixtures/historical_agent_score.sha256.txt \
                --output /tmp/historical-agent-score-delegated.json
              python -c "import json; p=json.load(open(\"/tmp/historical-agent-score-delegated.json\")); assert p[\"status\"] == \"PASS\"; assert p[\"semantic_status\"] == \"PASS\"; assert p[\"semantic_metrics\"][\"confirmed_gold_reference_count\"] == 3; assert p[\"metrics\"][\"delegated_printed_page_attempts\"] == [192,193,194]; assert p[\"metrics\"][\"verified_printed_pages\"] == [183,189,193]"
            '
      - name: Targeted boundary discrepancy scorer smoke test
        run: |
          docker compose --profile test run --rm --no-deps \
            -v "$PWD/benchmark:/benchmark:ro" \
            test sh -ec '
              python /benchmark/ingestion/evaluate_boundary_discrepancy.py \
                --result /benchmark/ingestion/fixtures/boundary_discrepancy_score.pass.json \
                --gold /benchmark/ingestion/gold/historical_bulletin_831_index.v1.json \
                --output /tmp/boundary-discrepancy-score.json
              python -c "import json; p=json.load(open(\"/tmp/boundary-discrepancy-score.json\")); assert p[\"status\"] == \"PASS\""
            '
      - name: Structure Auditor scorer smoke test
        run: |
          docker compose --profile test run --rm --no-deps \
            -v "$PWD/benchmark:/benchmark:ro" \
            test sh -ec '
              python /benchmark/ingestion/evaluate_structure_auditor.py \
                --result /benchmark/ingestion/fixtures/structure_auditor_score.pass.json \
                --gold /benchmark/ingestion/gold/historical_bulletin_831_index.v1.json \
                --output /tmp/structure-auditor-score.json
              python -c "import json; p=json.load(open(\"/tmp/structure-auditor-score.json\")); assert p[\"status\"] == \"PASS\""
            '
      - name: Pyright
        run: docker compose --profile test run --rm --no-deps test pyright

  ci-aggregate:
    name: CI aggregate
    runs-on: ubuntu-24.04
    needs: [backend-database, backend-quality]
    if: always()
    steps:
      - name: Require all jobs to pass
        run: |
          test "${{ needs.backend-database.result }}" = "success"
          test "${{ needs.backend-quality.result }}" = "success"

  docker-runtime:
    name: Docker runtime smoke test
    runs-on: ubuntu-24.04
    needs: [backend-database, backend-quality]
    if: needs.backend-database.result == 'success' && needs.backend-quality.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - name: Build runtime image
        run: docker compose build backend
      - name: Smoke runtime imports
        run: docker compose run --rm --no-deps backend python -c "import jurisnexo; print(jurisnexo.__name__)"
