name: SCJ Principales OCR fallback diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - development
    paths:
      - "benchmark/normalization/evaluate_scj_principales_ocr_holdout.py"
      - "benchmark/normalization/scj_page_selection.py"
      - "backend/src/jurisnexo/normalization/gold.py"
      - ".github/workflows/scj-principales-ocr-holdout.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scj-principales-ocr-holdout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  holdout:
    if: contains(github.event.pull_request.labels.*.name, 'normalization-holdout')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
      SCJ_NORMALIZATION_HOLDOUT_CASES: "6"
      SCJ_NORMALIZATION_HOLDOUT_MIN_REFERENCE_CHARS: "800"
      SCJ_NORMALIZATION_HOLDOUT_MAX_PAGES_TO_SCAN: "120"
      SCJ_NORMALIZATION_HOLDOUT_MAX_DOCUMENTS: "40"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install isolated OCR benchmark runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend \
            "boto3==1.43.93" \
            "docling==2.129.0" \
            "pypdfium2==5.13.0" \
            "pillow==12.3.0"

      - name: Measure forced full-page OCR fallback
        id: fallback
        continue-on-error: true
        env:
          SCJ_NORMALIZATION_HOLDOUT_OUTPUT: ${{ runner.temp }}/ocr-holdout/results.json
        run: |
          python benchmark/normalization/evaluate_scj_principales_ocr_holdout.py

      - name: Summarize fallback quality without promoting it
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "ocr-holdout" / "results.json"
          if not path.exists():
              raise SystemExit("fallback OCR benchmark did not produce results.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          holdout = payload["holdout"]
          gate = payload["quality_gate"]
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("## Forced OCR fallback diagnostic\n\n")
              stream.write(f"- gate passed: {gate['passed']}\n")
              stream.write(
                  f"- mean WER: {holdout['mean_word_error_rate']:.4f}\n"
              )
              stream.write(
                  "- token content recall / precision: "
                  f"{holdout['mean_token_content_recall']:.4f} / "
                  f"{holdout['mean_token_content_precision']:.4f}\n"
              )
              stream.write(
                  "- aggregate legal-critical recall: "
                  f"{holdout['aggregate_legal_critical_recall']:.4f}\n"
              )
              stream.write(
                  "\nThis lane is diagnostic for full-page OCR fallback. "
                  "It does not gate born-digital Principales rollout.\n"
              )
          PY

      - name: Preserve holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-principales-ocr-holdout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocr-holdout/**
          if-no-files-found: warn
          retention-days: 30
