name: SCJ Principales corpus suite

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - development
    paths:
      - "benchmark/normalization/principales_corpus_suite.py"
      - "benchmark/normalization/scj_page_selection.py"
      - "backend/src/jurisnexo/normalization/benchmark_suite.py"
      - "backend/src/jurisnexo/normalization/gold.py"
      - "backend/src/jurisnexo/normalization/adapters/docling.py"
      - "backend/src/jurisnexo/normalization/quality.py"
      - ".github/workflows/scj-principales-corpus-suite.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "suite, failed_pages, or selector_audit"
        required: true
        default: "suite"
      shard_index:
        description: "Zero-based content-hash shard index"
        required: true
        default: "0"
      shard_count:
        description: "Number of content-hash shards"
        required: true
        default: "1"
      document_limit:
        description: "Eligible documents to sample; 0 scans the entire shard"
        required: true
        default: "12"

permissions:
  contents: read

concurrency:
  group: scj-principales-corpus-suite-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  suite:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'corpus-suite')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
      SUITE_CONFIGS: "pdf_aware,full_ocr"
      SUITE_SHARD_INDEX: ${{ inputs.shard_index || '0' }}
      SUITE_SHARD_COUNT: ${{ inputs.shard_count || '1' }}
      SUITE_DOCUMENT_LIMIT: ${{ inputs.document_limit || '12' }}
      SUITE_COMPUTE_USD_PER_HOUR: ${{ vars.SUITE_COMPUTE_USD_PER_HOUR || '' }}
      SUITE_PAGES_PER_DOCUMENT: "2"
      SUITE_MAX_PAGES_TO_SCAN: "120"
      SUITE_RESUME: "1"
      SUITE_REQUIRED_CONFIGS: "pdf_aware"
      SUITE_MAX_MEAN_WER: "0.10"
      SUITE_MIN_CONTENT_RECALL: "0.98"
      SUITE_MIN_CONTENT_PRECISION: "0.98"
      SUITE_MIN_CRITICAL_RECALL: "1.0"
      SUITE_MIN_SAMPLED_DOCUMENT_PASS_RATE: "1.0"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install suite runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend \
            "boto3==1.43.93" \
            "docling==2.129.0" \
            "pypdf==6.19.0" \
            "pypdfium2==5.13.0" \
            "pillow==12.3.0"

      - name: Run configuration-comparison corpus suite
        if: inputs.mode != 'failed_pages' && inputs.mode != 'selector_audit'
        env:
          SUITE_OUTPUT_DIR: ${{ runner.temp }}/principales-corpus-suite
        run: |
          python benchmark/normalization/principales_corpus_suite.py

      - name: Reproduce failed pages and preserve text diffs
        if: inputs.mode == 'failed_pages'
        env:
          FAILURE_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/principales-failed-pages
        run: python benchmark/normalization/principales_failed_page_diagnostics.py

      - name: Classify volumes excluded by the page selector
        if: inputs.mode == 'selector_audit'
        env:
          SELECTOR_AUDIT_OUTPUT: ${{ runner.temp }}/principales-selector-audit
        run: python benchmark/normalization/principales_selector_audit.py

      - name: Publish suite summary
        if: always() && inputs.mode != 'failed_pages' && inputs.mode != 'selector_audit'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "principales-corpus-suite"
              / "summary.md"
          )
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if path.exists():
              summary.write_text(path.read_text(encoding="utf-8"), encoding="utf-8")
          else:
              summary.write_text(
                  "## SCJ Principales corpus suite\n\nno summary produced\n",
                  encoding="utf-8",
              )
          PY

      - name: Preserve suite report and records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-principales-corpus-suite-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/principales-corpus-suite/**
            ${{ runner.temp }}/principales-failed-pages/**
            ${{ runner.temp }}/principales-selector-audit/**
          if-no-files-found: warn
          retention-days: 90
