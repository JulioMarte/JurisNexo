name: Normalization engine spike

on:
  workflow_dispatch:
  pull_request:
    branches:
      - development
    paths:
      - "backend/src/jurisnexo/normalization/**"
      - "backend/scripts/normalization_engine_spike.py"
      - ".github/workflows/normalization-engine-spike.yml"

permissions:
  contents: read

jobs:
  docling-tika:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install isolated normalization runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "docling==2.129.0"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice

      - name: Start pinned Apache Tika
        run: |
          docker run --detach --rm             --name jurisnexo-tika             --publish 9998:9998             apache/tika:4.0.0-1-full
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9998/version >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs jurisnexo-tika
          exit 1

      - name: Run compatibility and fidelity spike
        env:
          PYTHONPATH: backend/src
          JURISNEXO_TIKA_URL: http://127.0.0.1:9998
        run: |
          python backend/scripts/normalization_engine_spike.py             --output .artifacts/normalization-engine-spike.json

      - name: Upload measured engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normalization-engine-spike
          path: .artifacts/normalization-engine-spike.json
          if-no-files-found: error
          retention-days: 30

      - name: Tika diagnostics
        if: failure()
        run: docker logs jurisnexo-tika || true
