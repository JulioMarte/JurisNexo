name: Branch hygiene

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-head:
    name: Delete merged head branch
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          ref_path="repos/${REPOSITORY}/git/refs/heads/${HEAD_REF}"

          if gh api --method DELETE "${ref_path}"; then
            echo "Deleted merged branch: ${HEAD_REF}"
            exit 0
          fi

          # Be idempotent if GitHub or another cleanup mechanism already deleted it.
          if ! gh api "repos/${REPOSITORY}/git/ref/heads/${HEAD_REF}" >/dev/null 2>&1; then
            echo "Merged branch already absent: ${HEAD_REF}"
            exit 0
          fi

          echo "Failed to delete merged branch: ${HEAD_REF}" >&2
          exit 1
