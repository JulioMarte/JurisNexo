name: Normalization live evidence persistence

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - development
    paths:
      - "backend/scripts/live_model_evidence_persistence_smoke.py"
      - "backend/src/jurisnexo/model_providers/openrouter_decisions.py"
      - "backend/src/jurisnexo/normalization/jev_batch_evaluator.py"
      - "backend/src/jurisnexo/normalization/model_quality.py"
      - "backend/src/jurisnexo/normalization/repository.py"
      - ".github/workflows/normalization-live-evidence-persistence.yml"

permissions:
  contents: read

concurrency:
  group: normalization-live-evidence-persistence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-evidence:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'live-evidence-persistence')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JURISNEXO_OPENROUTER_JEV_MODEL: "~typesafe/jev-latest"
      LIVE_MODEL_EVIDENCE_MAX_COST_USD: "0.005"
    steps:
      - uses: actions/checkout@v6

      - name: Assert live provider secret exists
        run: |
          test -n "$OPENROUTER_API_KEY" || {
            echo "OPENROUTER_API_KEY is not configured"
            exit 1
          }

      - name: Build deterministic test runtime
        run: docker compose --profile test build test

      - name: Start database and apply migrations
        run: |
          docker compose up -d db
          docker compose run --rm migrate
          docker compose run --rm bootstrap

      - name: Prove live provider evidence persists durably
        run: |
          mkdir -p "$RUNNER_TEMP/live-model-evidence"
          docker compose --profile test run --rm --no-deps             -e OPENROUTER_API_KEY             -e JURISNEXO_OPENROUTER_JEV_MODEL             -e LIVE_MODEL_EVIDENCE_MAX_COST_USD             -e LIVE_MODEL_EVIDENCE_OUTPUT=/artifacts             -e GITHUB_RUN_ID             -e GITHUB_RUN_ATTEMPT             -v "$PWD/backend/scripts:/scripts:ro"             -v "$RUNNER_TEMP/live-model-evidence:/artifacts"             test python /scripts/live_model_evidence_persistence_smoke.py

      - name: Preserve durable evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normalization-live-evidence-persistence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-model-evidence/**
          if-no-files-found: warn
          retention-days: 90

      - name: Tear down
        if: always()
        run: docker compose --profile test down -v --remove-orphans
