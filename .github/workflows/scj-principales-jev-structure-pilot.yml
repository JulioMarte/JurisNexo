name: SCJ Principales JEV structure pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scj-principales-jev-structure-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
      JURISNEXO_OPENROUTER_JEV_MODEL: "~typesafe/jev-latest"
      JEV_STRUCTURE_DOCUMENTS: "3"
      JEV_STRUCTURE_MAX_CANDIDATE_PAGES: "40"
      JEV_STRUCTURE_EXCERPT_CHARS: "2600"
      JEV_STRUCTURE_BATCH_SIZE: "10"
      JEV_STRUCTURE_MAX_COST_USD: "0.05"
      JEV_STRUCTURE_OUTPUT: ${{ runner.temp }}/jev-structure/pilot.json
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pilot runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend "boto3==1.43.93"

      - name: Contract checks
        run: |
          python -m py_compile \
            benchmark/normalization/jev_structure_pilot.py \
            backend/src/jurisnexo/normalization/jev_structure.py
          ruff check \
            benchmark/normalization/jev_structure_pilot.py \
            backend/src/jurisnexo/normalization/jev_structure.py \
            backend/tests/unit/test_jev_structure_pilot.py
          pytest -q backend/tests/unit/test_jev_structure_pilot.py

      - name: Run JEV structural-navigation pilot
        run: python benchmark/normalization/jev_structure_pilot.py

      - name: Preserve pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-principales-jev-structure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jev-structure/**
          if-no-files-found: warn
          retention-days: 90
