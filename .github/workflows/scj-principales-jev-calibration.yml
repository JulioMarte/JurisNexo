name: SCJ Principales JEV calibration

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [development]
    paths:
      - "benchmark/normalization/**"
      - "backend/src/jurisnexo/normalization/**"
      - "backend/tests/unit/test_jev_structure_pilot.py"
      - "backend/tests/unit/test_refine_jev_decision_candidates.py"
      - "backend/tests/unit/test_analyze_jev_failure_flywheel.py"
      - "backend/tests/unit/test_govern_jev_flywheel.py"
      - ".github/workflows/scj-principales-jev-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scj-principales-jev-calibration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  calibration:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'jev-calibration')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
      JURISNEXO_OPENROUTER_JEV_MODEL: "~typesafe/jev-latest"
      JEV_PRINCIPALES_SOURCE_CASES: "36"
      JEV_PRINCIPALES_PAGES_PER_SOURCE: "3"
      JEV_PRINCIPALES_EXCERPT_CHARS: "3500"
      JEV_PRINCIPALES_MAX_COST_USD: "0.05"
      JEV_PRINCIPALES_MIN_POSITIVE_CASES: "25"
      JEV_PRINCIPALES_MIN_NEGATIVE_CASES: "25"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install promotion-sized JEV benchmark runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend "boto3==1.43.93" "pypdfium2==5.13.0" "ruff==0.15.7" "pytest==9.0.2"
      - name: Run source-separated JEV calibration and holdout
        env:
          JEV_PRINCIPALES_BENCHMARK_OUTPUT: ${{ runner.temp }}/jev-calibration/results.json
        run: python benchmark/normalization/evaluate_jev_principales.py
      - name: Validate structural-navigation and flywheel
        run: |
          python -m py_compile benchmark/normalization/jev_structure_pilot.py benchmark/normalization/refine_jev_decision_candidates.py benchmark/normalization/evaluate_jev_structure_ablations.py benchmark/normalization/build_jev_boundary_audit.py benchmark/normalization/jev_exception_second_pass.py benchmark/normalization/analyze_jev_failure_flywheel.py benchmark/normalization/govern_jev_flywheel.py
          ruff check benchmark/normalization/jev_structure_pilot.py benchmark/normalization/refine_jev_decision_candidates.py benchmark/normalization/evaluate_jev_structure_ablations.py benchmark/normalization/build_jev_boundary_audit.py benchmark/normalization/jev_exception_second_pass.py benchmark/normalization/analyze_jev_failure_flywheel.py benchmark/normalization/govern_jev_flywheel.py
          ruff check backend/src/jurisnexo/normalization/jev_structure.py backend/tests/unit/test_jev_structure_pilot.py backend/tests/unit/test_refine_jev_decision_candidates.py backend/tests/unit/test_analyze_jev_failure_flywheel.py backend/tests/unit/test_govern_jev_flywheel.py
          pytest -q backend/tests/unit/test_jev_structure_pilot.py backend/tests/unit/test_refine_jev_decision_candidates.py backend/tests/unit/test_analyze_jev_failure_flywheel.py backend/tests/unit/test_govern_jev_flywheel.py
      - name: Run JEV structural-navigation pilot with exact audit trace
        env:
          JEV_STRUCTURE_DOCUMENTS: "3"
          JEV_STRUCTURE_MAX_CANDIDATE_PAGES: "40"
          JEV_STRUCTURE_EXCERPT_CHARS: "2600"
          JEV_STRUCTURE_BATCH_SIZE: "10"
          JEV_STRUCTURE_MAX_COST_USD: "0.05"
          JEV_STRUCTURE_OUTPUT: ${{ runner.temp }}/jev-calibration/structure-pilot.json
        run: python benchmark/normalization/jev_structure_pilot.py
      - name: Measure dependence on format-specific heuristics
        env:
          JEV_STRUCTURE_OUTPUT: ${{ runner.temp }}/jev-calibration/structure-pilot.json
          JEV_ABLATION_OUTPUT: ${{ runner.temp }}/jev-calibration/structure-ablations.json
        run: python benchmark/normalization/evaluate_jev_structure_ablations.py
      - name: Refine with evidence tiers instead of format hard-rejects
        env:
          JEV_STRUCTURE_OUTPUT: ${{ runner.temp }}/jev-calibration/structure-pilot.json
          JEV_REFINED_OUTPUT: ${{ runner.temp }}/jev-calibration/refined-decisions.json
          JEV_REFINED_TARGET_PAGES: "30"
          JEV_REFINED_MAX_SPAN_PAGES: "40"
          JEV_REFINED_MIN_SCORE: "0.72"
          JEV_REFINED_REVIEW_SCORE: "0.45"
        run: python benchmark/normalization/refine_jev_decision_candidates.py
      - name: Build third-party boundary audit packet
        env:
          JEV_STRUCTURE_OUTPUT: ${{ runner.temp }}/jev-calibration/structure-pilot.json
          JEV_REFINED_OUTPUT: ${{ runner.temp }}/jev-calibration/refined-decisions.json
          JEV_AUDIT_OUTPUT: ${{ runner.temp }}/jev-calibration/boundary-audit.json
        run: python benchmark/normalization/build_jev_boundary_audit.py
      - name: Expand all reviewable exception evidence and run diverse JEV second pass
        env:
          JEV_STRUCTURE_OUTPUT: ${{ runner.temp }}/jev-calibration/structure-pilot.json
          JEV_REFINED_OUTPUT: ${{ runner.temp }}/jev-calibration/refined-decisions.json
          JEV_EXCEPTION_OUTPUT: ${{ runner.temp }}/jev-calibration/exception-second-pass.json
          JEV_EXCEPTION_MAX_CASES: "109"
          JEV_EXCEPTION_BATCH_SIZE: "6"
          JEV_EXCEPTION_MAX_COST_USD: "0.03"
          JEV_EXCEPTION_EXCERPT_CHARS: "2600"
        run: python benchmark/normalization/jev_exception_second_pass.py
      - name: Mine deterministic improvement hypotheses
        env:
          JEV_EXCEPTION_OUTPUT: ${{ runner.temp }}/jev-calibration/exception-second-pass.json
          JEV_FLYWHEEL_OUTPUT: ${{ runner.temp }}/jev-calibration/failure-flywheel.json
          JEV_FLYWHEEL_MIN_PROBABILITY: "0.70"
          JEV_FLYWHEEL_MIN_CLUSTER_CASES: "2"
          JEV_FLYWHEEL_MIN_CLUSTER_DOCUMENTS: "2"
          JEV_FLYWHEEL_MIN_CLUSTER_FAMILIES: "2"
        run: python benchmark/normalization/analyze_jev_failure_flywheel.py
      - name: Enforce cross-era generalization governance
        env:
          JEV_FLYWHEEL_OUTPUT: ${{ runner.temp }}/jev-calibration/failure-flywheel.json
          JEV_GOVERNED_FLYWHEEL_OUTPUT: ${{ runner.temp }}/jev-calibration/failure-flywheel-governed.json
          JEV_FLYWHEEL_MIN_GENERALIZATION_GROUPS: "2"
        run: python benchmark/normalization/govern_jev_flywheel.py
      - name: Preserve JEV calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-principales-jev-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jev-calibration/**
          if-no-files-found: warn
          retention-days: 90
