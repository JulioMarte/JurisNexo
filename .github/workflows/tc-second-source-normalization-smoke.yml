name: TC second-source normalization smoke

on:
  pull_request:
    branches:
      - development
    paths:
      - "backend/src/jurisnexo/acquisition/tc_public.py"
      - "backend/scripts/tc_second_source_normalization_smoke.py"
      - ".github/workflows/tc-second-source-normalization-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tc-second-source-normalization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tc-normalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install isolated normalization runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend "docling==2.129.0"

      - name: Start pinned Apache Tika
        run: |
          docker run --detach --rm \
            --name jurisnexo-tika \
            --publish 9998:9998 \
            apache/tika:4.0.0-1-full
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9998/version >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs jurisnexo-tika
          exit 1

      - name: Normalize one official TC decision through the generic core
        env:
          PYTHONPATH: backend/src
          JURISNEXO_TIKA_URL: http://127.0.0.1:9998
          TC_SECOND_SOURCE_OUTPUT: ${{ runner.temp }}/tc-second-source/result.json
        run: python backend/scripts/tc_second_source_normalization_smoke.py

      - name: Upload second-source proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc-second-source-normalization-${{ github.run_id }}
          path: ${{ runner.temp }}/tc-second-source/**
          if-no-files-found: error
          retention-days: 30
