name: Vendor research papers (temporary)

on:
  push:
    branches:
      - agent-boundaries-research-library
    paths:
      - docs/research/papers.json
      - docs/research/download_papers.py
      - .github/workflows/vendor-research-papers.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent-boundaries-research-library
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download research PDFs
        run: python docs/research/download_papers.py
      - name: Commit vendored research references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/papers docs/research/checksums.sha256
          if git diff --cached --quiet; then
            echo "Research PDFs already materialized."
            exit 0
          fi
          git commit -m "docs: vendor research paper PDFs"
          git push origin HEAD:agent-boundaries-research-library
