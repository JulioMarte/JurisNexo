name: Dev database state audit

on:
  push:
    branches:
      - audit/dev-db-state

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST || vars.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || vars.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || vars.POSTGRES_PASSWORD }}
      POSTGRES_SSLMODE: ${{ secrets.POSTGRES_SSLMODE || vars.POSTGRES_SSLMODE }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install psycopg
        run: python -m pip install 'psycopg[binary]>=3.2,<4'

      - name: Audit schema without mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import psycopg

          required = [
              "POSTGRES_HOST", "POSTGRES_PORT", "POSTGRES_DB",
              "POSTGRES_USER", "POSTGRES_PASSWORD", "POSTGRES_SSLMODE",
          ]
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit(f"missing configuration keys: {', '.join(missing)}")

          conninfo = (
              f"host={os.environ['POSTGRES_HOST']} "
              f"port={os.environ['POSTGRES_PORT']} "
              f"dbname={os.environ['POSTGRES_DB']} "
              f"user={os.environ['POSTGRES_USER']} "
              f"password={os.environ['POSTGRES_PASSWORD']} "
              f"sslmode={os.environ['POSTGRES_SSLMODE']} "
              "connect_timeout=10"
          )

          expected_0019_tables = {
              "legal_matter_concepts",
              "procedure_concepts",
              "legal_proceedings",
              "proceeding_identifiers",
              "participants",
              "proceeding_participants",
              "proceeding_decisions",
              "procedural_decision_relation_observations",
              "procedural_decision_relations",
              "case_dispositions",
              "analysis_observations",
          }

          with psycopg.connect(conninfo, autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute("select current_database(), current_user, current_setting('server_version')")
                  db_name, db_user, server_version = cur.fetchone()

                  cur.execute("select to_regclass('public.alembic_version')")
                  has_alembic = cur.fetchone()[0] is not None
                  if has_alembic:
                      cur.execute("select version_num from alembic_version")
                      alembic_rows = [row[0] for row in cur.fetchall()]
                  else:
                      alembic_rows = []

                  cur.execute("select exists (select 1 from information_schema.schemata where schema_name = 'corpus')")
                  has_corpus_schema = cur.fetchone()[0]

                  cur.execute("""
                      select table_name
                      from information_schema.tables
                      where table_schema = 'corpus'
                      order by table_name
                  """)
                  tables = [row[0] for row in cur.fetchall()]
                  table_set = set(tables)

                  counts = {}
                  for table in (
                      "courts", "source_registries", "source_collections",
                      "source_documents", "source_artifacts", "cases",
                      "legal_proceedings", "analysis_observations",
                  ):
                      if table in table_set:
                          cur.execute(f"select count(*) from corpus.{table}")
                          counts[table] = cur.fetchone()[0]
                      else:
                          counts[table] = None

                  core_courts = []
                  if "courts" in table_set:
                      cur.execute("""
                          select code,
                                 coalesce(judicial_system, 'n/a'),
                                 coalesce(court_type, 'n/a')
                          from corpus.courts
                          where code in ('DO-SCJ', 'DO-TC')
                          order by code
                      """)
                      core_courts = [
                          {"code": r[0], "judicial_system": r[1], "court_type": r[2]}
                          for r in cur.fetchall()
                      ]

          report = {
              "database": db_name,
              "connected_user": db_user,
              "postgres_version": server_version,
              "has_alembic_version_table": has_alembic,
              "alembic_versions": alembic_rows,
              "has_corpus_schema": has_corpus_schema,
              "corpus_table_count": len(tables),
              "missing_0019_tables": sorted(expected_0019_tables - table_set),
              "core_courts": core_courts,
              "row_counts": counts,
          }
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY
