name: SCJ Principales final storage audit

on:
  push:
    branches:
      - feature/acquisition-run-manifests
    paths:
      - '.github/workflows/scj-principales-full-backfill.yml'

permissions:
  contents: read

concurrency:
  group: scj-principales-final-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Verify final Principales manifest state
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned storage runtime
        run: python -m pip install -e ./backend 'boto3==1.43.93'
      - name: Audit final Principales manifest state
        env:
          SCJ_PRINCIPALES_ADMIN_OUTPUT: ${{ runner.temp }}/scj-principales-admin
        run: |
          set -o pipefail
          python backend/scripts/scj_principales_storage_admin.py --audit-only 2>&1 | tee scj-principales-final-audit.log
      - name: Assert exactly one successful full manifest remains
        env:
          SCJ_PRINCIPALES_ADMIN_OUTPUT: ${{ runner.temp }}/scj-principales-admin
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['SCJ_PRINCIPALES_ADMIN_OUTPUT']) / 'manifest-audit.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['manifest_count'] == 1, data
          record = data['records'][0]
          assert record['classification'] == 'non-canary', record
          assert record['status'] == 'succeeded', record
          assert record['discovered_count'] == 36, record
          assert record['failed_count'] == 0, record
          assert str(record['ingestion_id']).endswith('-scj-principales-full'), record
          print(json.dumps(record, indent=2, sort_keys=True))
          PY
      - name: Preserve final audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-principales-final-audit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/scj-principales-admin/**
            scj-principales-final-audit.log
