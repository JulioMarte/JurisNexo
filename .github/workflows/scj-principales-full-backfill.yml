name: SCJ Principales one-shot full backfill

on:
  push:
    branches:
      - feature/acquisition-run-manifests
    paths:
      - '.github/workflows/scj-principales-full-backfill.yml'

permissions:
  contents: read

concurrency:
  group: scj-principales-one-shot-full-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Clean canaries and backfill all Principales
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      SCJ_PRINCIPALES_EXPECTED_COUNT: '36'
      SCJ_PRINCIPALES_ITEM_ATTEMPTS: '3'
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned runtime and focused test tools
        run: python -m pip install -e ./backend 'boto3==1.43.93' 'playwright==1.62.0' pytest ruff
      - name: Validate acquisition code before storage mutation
        run: |
          ruff check backend/src/jurisnexo/acquisition backend/scripts/scj_principales_backfill.py backend/scripts/scj_principales_storage_admin.py
          pytest -q backend/tests/unit/test_acquisition_http_fetcher.py backend/tests/unit/test_official_corpus_acquisition.py backend/tests/unit/test_acquisition_manifest.py
      - name: Install Chromium for verified official-source transport
        run: python -m playwright install --with-deps chromium
      - name: Re-audit and remove only canary manifests
        env:
          SCJ_PRINCIPALES_ADMIN_OUTPUT: ${{ runner.temp }}/scj-principales-admin
        run: |
          set -o pipefail
          python backend/scripts/scj_principales_storage_admin.py --cleanup-canaries 2>&1 | tee scj-principales-cleanup.log
      - name: Backfill all 36 Principales publications
        env:
          SCJ_PRINCIPALES_BACKFILL_OUTPUT: ${{ runner.temp }}/scj-principales-backfill
        run: |
          set -o pipefail
          python backend/scripts/scj_principales_backfill.py 2>&1 | tee scj-principales-backfill.log
      - name: Preserve cleanup and backfill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-principales-full-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/scj-principales-admin/**
            ${{ runner.temp }}/scj-principales-backfill/**
            scj-principales-cleanup.log
            scj-principales-backfill.log
