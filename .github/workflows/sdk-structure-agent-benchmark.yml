name: SDK structure agent benchmark

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Official Poder Judicial historical bulletin PDF URL
        required: true
        default: https://transparencia.poderjudicial.gob.do/documentos/PDF/boletines/1980/FEBRERO.pdf
        type: string
      provider:
        description: Model provider
        required: true
        default: gemini
        type: choice
        options:
          - gemini
          - deepseek
      model:
        description: Explicit provider model ID
        required: true
        default: gemini-3.8-flash
        type: string
      max_turns:
        description: Maximum agent turns
        required: true
        default: "16"
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-structure-agent-benchmark-${{ inputs.provider }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: llm-benchmark
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v6

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.4

      - name: Install Python
        run: uv python install 3.13

      - name: Install locked backend
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Validate provider secret
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.provider }}" in
            gemini) test -n "${GEMINI_API_KEY:-}" || { echo "GEMINI_API_KEY is required" >&2; exit 1; } ;;
            deepseek) test -n "${DEEPSEEK_API_KEY:-}" || { echo "DEEPSEEK_API_KEY is required" >&2; exit 1; } ;;
            *) exit 2 ;;
          esac

      - name: Acquire allowlisted official PDF
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="${{ inputs.source_url }}"
          case "$SOURCE_URL" in
            https://transparencia.poderjudicial.gob.do/documentos/PDF/boletines/*.pdf|https://transparencia.poderjudicial.gob.do/documentos/PDF/boletines/*.PDF) ;;
            *) echo "Refusing non-allowlisted source URL: $SOURCE_URL" >&2; exit 1 ;;
          esac
          mkdir -p benchmark-output
          curl --fail --location --show-error --silent --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 600 "$SOURCE_URL" -o benchmark-output/source.pdf
          test "$(head -c 4 benchmark-output/source.pdf)" = "%PDF"
          sha256sum benchmark-output/source.pdf | tee benchmark-output/sha256.txt
          pdftotext -bbox-layout benchmark-output/source.pdf benchmark-output/bbox-layout.html

      - name: Run production Structure Agent
        working-directory: backend
        run: |
          uv run python ../benchmark/ingestion/run_sdk_structure_agent_benchmark.py \
            --bbox ../benchmark-output/bbox-layout.html \
            --output ../benchmark-output/sdk-structure-result.json \
            --artifact-label "Official SCJ Boletín Judicial Núm. 831, Febrero 1980. Verify the SUMARIO and investigate index-to-destination discrepancies, including neighboring printed pages when a claimed destination does not match." \
            --provider "${{ inputs.provider }}" \
            --model "${{ inputs.model }}" \
            --max-turns "${{ inputs.max_turns }}"

      - name: Score against frozen historical gold
        working-directory: backend
        run: |
          uv run python ../benchmark/ingestion/evaluate_historical_bulletin_agent.py \
            --result ../benchmark-output/sdk-structure-result.json \
            --gold ../benchmark/ingestion/gold/historical_bulletin_831_index.v1.json \
            --sha256 ../benchmark-output/sha256.txt \
            --output ../benchmark-output/sdk-structure-score.json

      - name: Print benchmark summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('benchmark-output')
          for name in ('sdk-structure-result.json', 'sdk-structure-score.json', 'sdk-structure-agent-error.json'):
              path = out / name
              if path.exists():
                  print(f'--- {name} ---')
                  print(json.dumps(json.loads(path.read_text()), ensure_ascii=False, indent=2))
          PY

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-structure-${{ inputs.provider }}-${{ github.run_id }}
          path: |
            benchmark-output/sha256.txt
            benchmark-output/sdk-structure-result.json
            benchmark-output/sdk-structure-score.json
            benchmark-output/sdk-structure-agent-error.json
          if-no-files-found: warn
          retention-days: 14
