name: SDK structure agent benchmark

on:
  push:
    branches:
      - benchmark/gemini38-vs-deepseek-v4-flash
    paths:
      - '.github/workflows/sdk-structure-agent-benchmark.yml'
      - 'benchmark/ingestion/**'
      - 'backend/src/jurisnexo/ingestion/**'
      - 'backend/src/jurisnexo/model_providers/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-structure-agent-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: ${{ matrix.provider }} / ${{ matrix.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: gemini
            model: gemini-3.8-flash
          - provider: deepseek
            model: deepseek-v4-flash
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      UV_PYTHON: '3.13'
      SOURCE_URL: https://transparencia.poderjudicial.gob.do/documentos/PDF/boletines/1980/FEBRERO.pdf
      MAX_TURNS: '16'
    steps:
      - uses: actions/checkout@v6

      - name: Validate provider secret
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.provider }}' in
            gemini) test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY is required' >&2; exit 1; } ;;
            deepseek) test -n "${DEEPSEEK_API_KEY:-}" || { echo 'DEEPSEEK_API_KEY is required' >&2; exit 1; } ;;
            *) exit 2 ;;
          esac

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.4

      - name: Install Python
        run: uv python install 3.13

      - name: Install locked backend
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Acquire frozen official PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-output
          curl --fail --location --show-error --silent --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 600 "$SOURCE_URL" -o benchmark-output/source.pdf
          test "$(head -c 4 benchmark-output/source.pdf)" = '%PDF'
          sha256sum benchmark-output/source.pdf | tee benchmark-output/sha256.txt
          pdftotext -bbox-layout benchmark-output/source.pdf benchmark-output/bbox-layout.html

      - name: Run production Structure Agent
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uv run python ../benchmark/ingestion/run_sdk_structure_agent_benchmark.py \
            --bbox ../benchmark-output/bbox-layout.html \
            --output ../benchmark-output/sdk-structure-result.json \
            --artifact-label "Official SCJ Boletín Judicial Núm. 831, Febrero 1980. Verify the SUMARIO and investigate index-to-destination discrepancies, including neighboring printed pages when a claimed destination does not match." \
            --provider '${{ matrix.provider }}' \
            --model '${{ matrix.model }}' \
            --max-turns "$MAX_TURNS" \
            2>&1 | tee ../benchmark-output/agent-run.log

      - name: Score against frozen historical gold
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uv run python ../benchmark/ingestion/evaluate_historical_bulletin_agent.py \
            --result ../benchmark-output/sdk-structure-result.json \
            --gold ../benchmark/ingestion/gold/historical_bulletin_831_index.v1.json \
            --sha256 ../benchmark-output/sha256.txt \
            --output ../benchmark-output/sdk-structure-score.json \
            2>&1 | tee ../benchmark-output/scorer.log

      - name: Write benchmark metadata
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('benchmark-output/benchmark-metadata.json').write_text(
              json.dumps({
                  'provider': '${{ matrix.provider }}',
                  'model': '${{ matrix.model }}',
                  'github_sha': '${{ github.sha }}',
                  'run_id': '${{ github.run_id }}',
              }, indent=2),
              encoding='utf-8',
          )
          PY

      - name: Print benchmark summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('benchmark-output')
          for name in ('benchmark-metadata.json', 'sdk-structure-result.json', 'sdk-structure-score.json', 'sdk-structure-agent-error.json'):
              path = out / name
              if path.exists():
                  print(f'--- {name} ---')
                  print(json.dumps(json.loads(path.read_text()), ensure_ascii=False, indent=2))
          PY

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-structure-${{ matrix.provider }}-${{ matrix.model }}-${{ github.run_id }}
          path: |
            benchmark-output/sha256.txt
            benchmark-output/benchmark-metadata.json
            benchmark-output/sdk-structure-result.json
            benchmark-output/sdk-structure-score.json
            benchmark-output/sdk-structure-agent-error.json
            benchmark-output/agent-run.log
            benchmark-output/scorer.log
          if-no-files-found: warn
          retention-days: 14
