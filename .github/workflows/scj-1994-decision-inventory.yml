name: SCJ 1994+ decision inventory

on:
  push:
    branches:
      - feature/acquisition-run-manifests
    paths:
      - '.github/workflows/scj-1994-decision-inventory.yml'

permissions:
  contents: read

concurrency:
  group: scj-1994-decision-inventory
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  inventory:
    name: ${{ matrix.surface }} shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        surface: [decisions, historical]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned inventory runtime
        run: python -m pip install 'playwright==1.62.0' 'opentelemetry-api==1.44.0' 'opentelemetry-sdk==1.44.0'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Enumerate live SCJ source rows
        env:
          SCJ_SURFACE: ${{ matrix.surface }}
          SCJ_SHARD_INDEX: ${{ matrix.shard }}
          SCJ_SHARD_COUNT: '4'
          SCJ_SHARD_OUTPUT: ${{ runner.temp }}/scj-inventory
        run: |
          set -o pipefail
          python backend/scripts/scj_inventory_shard.py 2>&1 | tee scj-${{ matrix.surface }}-${{ matrix.shard }}.log
      - name: Preserve inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-1994-inventory-${{ matrix.surface }}-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/scj-inventory/**
            scj-${{ matrix.surface }}-${{ matrix.shard }}.log

  inspect:
    name: Inspect year coverage and source shape
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: scj-1994-inventory-*
          path: ${{ runner.temp }}/inventory
          merge-multiple: true
      - name: Summarize live year fields and samples
        env:
          INPUT: ${{ runner.temp }}/inventory
        run: |
          python - <<'PY'
          import json, os, re
          from collections import Counter, defaultdict
          from pathlib import Path
          root=Path(os.environ['INPUT'])
          records=defaultdict(list)
          for path in root.glob('*-shard-*.jsonl'):
              if path.name.endswith('-rejected.jsonl'): continue
              for line in path.read_text(encoding='utf-8').splitlines():
                  if not line.strip(): continue
                  rec=json.loads(line)
                  records[rec['surface']].append(rec)
          out={}
          for surface, items in records.items():
              key_counts=Counter()
              samples=[]
              for rec in items:
                  row=rec['row']
                  key_counts.update(row.keys())
                  if len(samples)<3: samples.append(row)
              out[surface]={
                  'raw_records':len(items),
                  'row_keys':dict(key_counts),
                  'samples':samples,
              }
          print(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True))
          Path('scj-1994-source-shape.json').write_text(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scj-1994-source-shape
          retention-days: 30
          if-no-files-found: error
          path: scj-1994-source-shape.json
