name: SCJ visual judge calibration benchmark

on:
  pull_request:
    types: [labeled]
    branches: [development]
  workflow_dispatch:
    inputs:
      page_limit:
        description: Admitted source pages per model (max 100; each gets clean + corruption)
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install offline benchmark runtime
        run: python -m pip install -e ./backend pytest==9.1.1
      - name: Prove paired verification and alignment contracts
        run: |
          pytest -q \
            backend/tests/unit/test_scj_visual_benchmark.py \
            backend/tests/unit/test_visual_reference_alignment.py \
            backend/tests/unit/test_visual_reference_ocr.py
          python -m py_compile \
            benchmark/normalization/visual_judge_100_page_benchmark.py \
            backend/scripts/scj_principales_visual_benchmark.py

  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'live-visual-smoke' ||
      github.event.label.name == 'live-visual-10'
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
      SCJ_VISUAL_STAGE: prepare
      SCJ_VISUAL_SAMPLE_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.page_limit || github.event.label.name == 'live-visual-10' && '10' || '1' }}
      SCJ_VISUAL_SELECTION: deterministic
      SCJ_VISUAL_SEED: "20260926"
      SCJ_VISUAL_ALIGNMENT_AUDIT_SIZE: ${{ github.event_name == 'workflow_dispatch' && (inputs.page_limit == '100' && '500' || inputs.page_limit == '20' && '200' || inputs.page_limit == '10' && '100' || '20') || github.event.label.name == 'live-visual-10' && '100' || '20' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install independent visual-reference OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-spa \
            tesseract-ocr-eng
      - name: Install bounded preparation runtime
        run: |
          python -m pip install -e ./backend \
            "boto3==1.43.93" \
            "pypdfium2==5.13.0" \
            "pillow==12.3.0"
      - name: Admit and freeze source pages
        env:
          SCJ_VISUAL_OUTPUT: ${{ runner.temp }}/prepared
        run: python backend/scripts/scj_principales_visual_benchmark.py
      - name: Preserve immutable prepared evidence
        uses: actions/upload-artifact@v4
        with:
          name: visual-judge-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared/**
          if-no-files-found: error
          retention-days: 90

  judge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'live-visual-smoke' ||
      github.event.label.name == 'live-visual-10'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - judge: deepseek-official
            model: deepseek/deepseek-v4.1-flash
            provider: DeepSeek
            structured_mode: prompt_json
          - judge: luna-official
            model: openai/gpt-6-luna
            provider: OpenAI
            structured_mode: tool
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VISUAL_JUDGE_MODEL: ${{ matrix.model }}
      VISUAL_JUDGE_PROVIDER: ${{ matrix.provider }}
      VISUAL_JUDGE_REASONING: high
      VISUAL_JUDGE_STRUCTURED_MODE: ${{ matrix.structured_mode }}
      VISUAL_JUDGE_MAX_OUTPUT_TOKENS: "2048"
      VISUAL_JUDGE_PAGE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.page_limit || github.event.label.name == 'live-visual-10' && '10' || '1' }}
      VISUAL_JUDGE_MAX_COST_USD: "1.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install benchmark runtime
        run: python -m pip install -e ./backend
      - name: Download exact admitted page evidence
        uses: actions/download-artifact@v4
        with:
          name: visual-judge-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
      - name: Run paired clean/corruption visual judge benchmark
        env:
          VISUAL_JUDGE_PREPARED_MANIFEST: ${{ runner.temp }}/prepared/prepared-manifest.json
          VISUAL_JUDGE_OUTPUT: ${{ runner.temp }}/visual-judge
        run: python benchmark/normalization/visual_judge_100_page_benchmark.py
      - name: Add compact report to summary
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/visual-judge/report.json" ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "visual-judge" / "report.json")
              .read_text(encoding="utf-8")
          )
          def metric(value):
              return "n/a" if value is None else f"{value:.4f}"
          def money(value, digits):
              return "n/a" if value is None else f"${value:.{digits}f}"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"## {report['model']} via {report['pinned_provider']}\n\n")
              out.write(f"- admitted source pages: {report['source_page_count']}\n")
              out.write(f"- verification cases: {report['verification_case_count']}\n")
              out.write(f"- structured mode: {report['structured_mode']}\n")
              out.write(f"- false correction rate: {metric(report['false_correction_rate'])}\n")
              out.write(f"- corruption detection recall: {metric(report['corruption_detection_recall'])}\n")
              out.write(f"- corruption localization recall: {metric(report['corruption_localization_recall'])}\n")
              out.write(f"- fully correct pair rate: {metric(report['fully_correct_pair_rate'])}\n")
              out.write(f"- observed cost: {money(report['observed_cost_usd'], 6)}\n")
              out.write(f"- mean cost/source page: {money(report['mean_cost_per_source_page_usd'], 8)}\n")
              out.write(f"- mean latency/verification: {report['mean_latency_ms']:.0f} ms\n")
          PY
          fi
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-judge-${{ matrix.judge }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-judge/**
          if-no-files-found: warn
          retention-days: 90
