name: SCJ Principales aligned-text legal fact benchmark

on:
  workflow_dispatch:
    inputs:
      page_count:
        description: "Aligned pages to benchmark"
        required: true
        default: "10"
        type: choice
        options: ["10", "50", "290"]
      max_concurrency:
        description: "Maximum concurrent provider calls"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: scj-principales-text-fact-${{ github.ref }}
  cancel-in-progress: true

env:
  JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
  JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
  JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
  JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
  JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
  JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
  SCJ_VISUAL_PAGE_COUNT: ${{ inputs.page_count }}
  SCJ_TEXT_FACT_PAGE_COUNT: ${{ inputs.page_count }}
  SCJ_TEXT_FACT_MAX_CONCURRENCY: ${{ inputs.max_concurrency }}
  SCJ_VISUAL_CORPUS_SEED: jurisnexo-principales-visual-v1

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install corpus preparation runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
          python -m pip install -e ./backend "boto3==1.43.93" "pypdfium2==5.13.0" "pillow==12.3.0"
      - name: Rebuild the exact dual-channel admitted corpus
        env:
          SCJ_VISUAL_CORPUS_MANIFEST: ${{ runner.temp }}/manifest.json
          SCJ_VISUAL_REFERENCE_EVIDENCE_DIR: ${{ runner.temp }}/alignment-evidence
          SCJ_VISUAL_ALIGNMENT_AUDIT_LIMIT: "700"
        run: python backend/scripts/scj_principales_visual_corpus_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: scj-text-fact-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/manifest.json
            ${{ runner.temp }}/alignment-evidence/**
          retention-days: 90

  model:
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - judge: deepseek-high
            model: deepseek/deepseek-v4.1-flash
            provider: DeepSeek
            reasoning: high
          - judge: luna-high
            model: openai/gpt-6-luna
            provider: OpenAI
            reasoning: high
          - judge: ling-low
            model: inclusionai/ling-3.0-flash-vl
            provider: ""
            reasoning: low
          - judge: ling-medium
            model: inclusionai/ling-3.0-flash-vl
            provider: ""
            reasoning: medium
          - judge: ling-high
            model: inclusionai/ling-3.0-flash-vl
            provider: ""
            reasoning: high
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JURISNEXO_OPENROUTER_TEXT_MODEL: ${{ matrix.model }}
      SCJ_TEXT_FACT_PROVIDER: ${{ matrix.provider }}
      SCJ_TEXT_FACT_REASONING: ${{ matrix.reasoning }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install benchmark runtime
        run: python -m pip install -e ./backend "boto3==1.43.93" "pypdfium2==5.13.0"
      - uses: actions/download-artifact@v4
        with:
          name: scj-text-fact-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manifest
      - name: Run one-call text extraction benchmark
        env:
          SCJ_TEXT_FACT_MANIFEST: ${{ runner.temp }}/manifest/manifest.json
          SCJ_TEXT_FACT_OUTPUT: ${{ runner.temp }}/text-fact
        run: python backend/scripts/scj_principales_text_fact_benchmark.py
      - name: Publish model summary
        if: always()
        run: test -f "${RUNNER_TEMP}/text-fact/summary.md" && cat "${RUNNER_TEMP}/text-fact/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scj-text-fact-${{ matrix.judge }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/text-fact/**
          if-no-files-found: warn
          retention-days: 90

  compare:
    needs: model
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: scj-text-fact-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reports
          merge-multiple: false
      - name: Build cross-model comparison
        run: |
          python backend/scripts/compare_text_fact_reports.py --input "${RUNNER_TEMP}/reports" --output "${RUNNER_TEMP}/comparison"
          cat "${RUNNER_TEMP}/comparison/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: scj-text-fact-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/comparison/**
          retention-days: 90
