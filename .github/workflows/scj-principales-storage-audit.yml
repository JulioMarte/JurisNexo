name: SCJ Principales storage audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scj-principales-storage-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Verify effective S3 target and Principales state
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned storage runtime
        run: python -m pip install -e ./backend 'boto3==1.43.93'
      - name: Read-only storage audit
        env:
          SCJ_PRINCIPALES_ADMIN_OUTPUT: ${{ runner.temp }}/scj-principales-admin
        run: |
          set -o pipefail
          python backend/scripts/scj_principales_storage_admin.py --audit-only 2>&1 | tee scj-principales-storage-audit.log
      - name: Assert expected Principales storage state
        env:
          SCJ_PRINCIPALES_ADMIN_OUTPUT: ${{ runner.temp }}/scj-principales-admin
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['SCJ_PRINCIPALES_ADMIN_OUTPUT'])/'manifest-audit.json').read_text())
          expected = '02ab33707c72f445f70f400f18e089c00328ff19bbd5c306a93eeee1ffe2101f'
          actual = data['storage_identity']['bucket_sha256']
          assert actual == expected, f'CI S3 bucket fingerprint mismatch: {actual}'
          assert data['principales_objects']['count'] == 36, data['principales_objects']
          assert data['manifest_count'] == 1, data['records']
          record = data['records'][0]
          assert record['classification'] == 'non-canary', record
          assert record['status'] == 'succeeded', record
          versions = data['manifest_versions']
          assert versions['delete_marker_count'] == 0, versions
          assert versions['version_count'] == 1, versions
          assert 'scj-principales-full.json' in versions['versions'][0]['key'], versions
          print(json.dumps({
              'bucket_fingerprint': actual,
              'pdf_count': data['principales_objects']['count'],
              'pdf_total_size': data['principales_objects']['total_size'],
              'manifest_count': data['manifest_count'],
              'manifest_version_count': versions['version_count'],
              'delete_marker_count': versions['delete_marker_count'],
          }, indent=2, sort_keys=True))
          PY
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-principales-storage-audit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/scj-principales-admin/**
            scj-principales-storage-audit.log
