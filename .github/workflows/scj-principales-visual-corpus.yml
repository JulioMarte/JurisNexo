name: SCJ Principales visual corpus benchmark

on:
  workflow_dispatch:
    inputs:
      page_count:
        description: "Number of full pages to benchmark"
        required: true
        default: "1"
        type: choice
        options: ["1", "100", "500"]
      max_concurrency:
        description: "Maximum concurrent provider calls"
        required: true
        default: "1"
        type: string
  pull_request:
    types: [synchronize]
    branches: [development]
    paths:
      - ".github/workflows/scj-principales-visual-corpus.yml"

permissions:
  contents: read

concurrency:
  group: scj-principales-visual-corpus-${{ github.ref }}
  cancel-in-progress: true

env:
  JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
  JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
  JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
  JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
  JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
  JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
  SCJ_VISUAL_PAGE_COUNT: ${{ inputs.page_count || '1' }}
  SCJ_VISUAL_MAX_CONCURRENCY: ${{ inputs.max_concurrency || '1' }}
  SCJ_VISUAL_CORPUS_SEED: jurisnexo-principales-visual-v1

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install runtime
        run: python -m pip install -e ./backend "boto3==1.43.93" "pypdfium2==5.13.0" "pillow==12.3.0"
      - name: Freeze exact requested pages once
        env:
          SCJ_VISUAL_CORPUS_MANIFEST: ${{ runner.temp }}/manifest.json
          JURISNEXO_OPENROUTER_VISUAL_MODEL: manifest-only
        run: python backend/scripts/scj_principales_visual_corpus_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: scj-visual-corpus-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manifest.json
          retention-days: 90

  judge:
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - judge: deepseek-official
            model: deepseek/deepseek-v4.1-flash
            provider: DeepSeek
          - judge: luna-official
            model: openai/gpt-6-luna
            provider: OpenAI
          - judge: ling-vl
            model: inclusionai/ling-3.0-flash-vl
            provider: ""
          - judge: gemini-flash-lite
            model: google/gemini-2.5-flash-lite
            provider: ""
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JURISNEXO_OPENROUTER_VISUAL_MODEL: ${{ matrix.model }}
      SCJ_VISUAL_PROVIDER: ${{ matrix.provider }}
      SCJ_VISUAL_STRUCTURED_MODE: raw_text
      SCJ_VISUAL_REASONING: none
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install runtime
        run: python -m pip install -e ./backend "boto3==1.43.93" "pypdfium2==5.13.0" "pillow==12.3.0"
      - uses: actions/download-artifact@v4
        with:
          name: scj-visual-corpus-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manifest
      - name: Run full-page visual benchmark without JurisNexo token cap
        env:
          SCJ_VISUAL_CORPUS_MODE: run
          SCJ_VISUAL_CORPUS_MANIFEST: ${{ runner.temp }}/manifest/manifest.json
          SCJ_VISUAL_CORPUS_OUTPUT: ${{ runner.temp }}/visual-corpus
        run: python backend/scripts/scj_principales_visual_corpus_benchmark.py
      - name: Publish summary
        if: always()
        run: test -f "${RUNNER_TEMP}/visual-corpus/summary.md" && cat "${RUNNER_TEMP}/visual-corpus/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Preserve per-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-visual-corpus-${{ matrix.judge }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-corpus/**
          if-no-files-found: warn
          retention-days: 90
