name: Document discovery benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Discovery strategy
        required: true
        default: agentic
        type: choice
        options:
          - agentic
          - one-shot
      input_path:
        description: Repo-relative text file; form-feed separates physical/sample pages
        required: true
        default: benchmark/ingestion/discovery/fixtures/legacy_bulletin_full_sample.txt
        type: string
      truth_path:
        description: Repo-relative structural ground-truth JSON file
        required: true
        default: benchmark/ingestion/discovery/fixtures/legacy_bulletin_full_sample.truth.json
        type: string
      artifact_label:
        description: Human-readable artifact label for the discovery prompt
        required: true
        default: synthetic-legacy-bulletin-full
        type: string
      model:
        description: Gemini model ID
        required: true
        default: gemini-3.8-flash
        type: string
      service_tier:
        description: Gemini inference tier
        required: true
        default: flex
        type: choice
        options:
          - flex
          - standard
          - priority
      thinking_level:
        description: Gemini thinking level
        required: true
        default: medium
        type: choice
        options:
          - low
          - medium
          - high
      max_output_tokens:
        description: Output-token ceiling for one-shot or final synthesis
        required: true
        default: "4096"
        type: string
      max_model_calls:
        description: Agentic mode hard ceiling including final synthesis
        required: true
        default: "6"
        type: string
      max_total_tokens:
        description: Agentic mode cumulative provider-reported token ceiling
        required: true
        default: "24000"
        type: string

permissions:
  contents: read

concurrency:
  group: document-discovery-benchmark
  cancel-in-progress: false

jobs:
  discover:
    name: Bounded Gemini discovery
    runs-on: ubuntu-24.04
    # Flex is a best-effort tier. Google documents a 1-15 minute latency target per request,
    # so a bounded multi-step run needs more room than ordinary CI.
    timeout-minutes: 120
    environment: llm-benchmark
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_PROVIDER: google
      LLM_MODEL: ${{ inputs.model }}
      LLM_SERVICE_TIER: ${{ inputs.service_tier }}
      LLM_THINKING_LEVEL: ${{ inputs.thinking_level }}
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.4

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install locked backend environment
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Show benchmark runtime
        working-directory: backend
        run: uv run python --version

      - name: Require Gemini secret
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY is not configured in the llm-benchmark GitHub Environment." >&2
            exit 1
          fi

      - name: Run bounded discovery
        working-directory: backend
        run: |
          set -euo pipefail

          if [ "${{ inputs.mode }}" = "agentic" ]; then
            uv run python ../benchmark/ingestion/run_agentic_document_discovery.py \
              --input "../${{ inputs.input_path }}" \
              --output "../benchmark-output/discovery-result.json" \
              --artifact-label "${{ inputs.artifact_label }}" \
              --model "${{ inputs.model }}" \
              --service-tier "${{ inputs.service_tier }}" \
              --thinking-level "${{ inputs.thinking_level }}" \
              --max-model-calls "${{ inputs.max_model_calls }}" \
              --max-total-tokens "${{ inputs.max_total_tokens }}" \
              --synthesis-max-output-tokens "${{ inputs.max_output_tokens }}"
          else
            uv run python ../benchmark/ingestion/run_document_discovery.py \
              --input "../${{ inputs.input_path }}" \
              --output "../benchmark-output/discovery-result.json" \
              --artifact-label "${{ inputs.artifact_label }}" \
              --model "${{ inputs.model }}" \
              --service-tier "${{ inputs.service_tier }}" \
              --thinking-level "${{ inputs.thinking_level }}" \
              --max-output-tokens "${{ inputs.max_output_tokens }}"
          fi

      - name: Score structural discovery
        working-directory: backend
        run: |
          uv run python ../benchmark/ingestion/evaluate_document_discovery.py \
            --result "../benchmark-output/discovery-result.json" \
            --truth "../${{ inputs.truth_path }}" \
            --output "../benchmark-output/discovery-score.json"

      - name: Show structural score
        run: cat benchmark-output/discovery-score.json

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: document-discovery-${{ inputs.mode }}-${{ inputs.service_tier }}-${{ github.run_id }}
          path: |
            benchmark-output/discovery-result.json
            benchmark-output/discovery-score.json
          if-no-files-found: error
          retention-days: 14
