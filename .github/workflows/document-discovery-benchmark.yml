name: Document discovery benchmark

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: Repo-relative page-sample text file; form-feed separates sampled pages
        required: true
        default: benchmark/ingestion/discovery/fixtures/legacy_bulletin_sample.txt
        type: string
      artifact_label:
        description: Human-readable artifact label for the discovery prompt
        required: true
        default: synthetic-legacy-bulletin
        type: string
      model:
        description: Gemini model ID
        required: true
        default: gemini-3.8-flash
        type: string
      thinking_level:
        description: Gemini thinking level
        required: true
        default: medium
        type: choice
        options:
          - low
          - medium
          - high
      max_output_tokens:
        description: Hard output-token ceiling for this single request
        required: true
        default: "4096"
        type: string

permissions:
  contents: read

concurrency:
  group: document-discovery-benchmark
  cancel-in-progress: false

jobs:
  discover:
    name: Bounded Gemini discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: llm-benchmark
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_PROVIDER: google
      LLM_MODEL: ${{ inputs.model }}
      LLM_THINKING_LEVEL: ${{ inputs.thinking_level }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.4

      - name: Install locked backend environment
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Require Gemini secret
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY is not configured in the llm-benchmark GitHub Environment." >&2
            exit 1
          fi

      - name: Run one bounded discovery request
        working-directory: backend
        run: |
          uv run python ../benchmark/ingestion/run_document_discovery.py \
            --input "../${{ inputs.input_path }}" \
            --output "../benchmark-output/discovery-result.json" \
            --artifact-label "${{ inputs.artifact_label }}" \
            --model "${{ inputs.model }}" \
            --thinking-level "${{ inputs.thinking_level }}" \
            --max-output-tokens "${{ inputs.max_output_tokens }}"

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: document-discovery-${{ github.run_id }}
          path: benchmark-output/discovery-result.json
          if-no-files-found: error
          retention-days: 14
