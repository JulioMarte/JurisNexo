name: SCJ Principales visual benchmark

on:
  pull_request:
    types: [synchronize, opened, reopened]
    branches: [development]
    paths:
      - "backend/scripts/scj_principales_visual_benchmark.py"
      - "backend/src/jurisnexo/normalization/visual_page_benchmark.py"
      - "backend/src/jurisnexo/normalization/visual_reference_alignment.py"
      - "backend/src/jurisnexo/normalization/visual_reference_ocr.py"
      - "backend/tests/unit/test_visual_page_benchmark.py"
      - "backend/tests/unit/test_visual_reference_alignment.py"
      - "backend/tests/unit/test_visual_reference_ocr.py"
      - ".github/workflows/scj-principales-visual-smoke.yml"
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Pages to benchmark"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "10"
          - "20"
      selection:
        description: "How to select from the eligible page pool"
        required: true
        default: deterministic
        type: choice
        options:
          - deterministic
          - random
      seed:
        description: "Seed used when selection=random"
        required: true
        default: "20260926"
        type: string
      max_concurrency:
        description: "Maximum provider calls in flight per model"
        required: true
        default: "20"
        type: string
      curated_manifest:
        description: "Optional repo-relative curated manifest path"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install offline test runtime
        run: python -m pip install -e ./backend pytest==9.1.1
      - name: Validate benchmark contracts without provider spend
        run: |
          pytest -q \
            backend/tests/unit/test_visual_page_benchmark.py \
            backend/tests/unit/test_visual_reference_alignment.py \
            backend/tests/unit/test_visual_reference_ocr.py
      - name: Compile benchmark entrypoint
        run: python -m py_compile backend/scripts/scj_principales_visual_benchmark.py

  prepare:
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      SCJ_VISUAL_STAGE: prepare
      SCJ_VISUAL_SAMPLE_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.sample_size || '1' }}
      SCJ_VISUAL_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.selection || 'deterministic' }}
      SCJ_VISUAL_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.seed || '20260926' }}
      SCJ_VISUAL_CURATED_MANIFEST: ${{ github.event_name == 'workflow_dispatch' && inputs.curated_manifest || '' }}
      SCJ_VISUAL_ALIGNMENT_AUDIT_SIZE: ${{ github.event_name == 'workflow_dispatch' && (inputs.sample_size == '20' && '40' || inputs.sample_size == '10' && '20' || '20') || '20' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install independent visual-reference OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-spa \
            tesseract-ocr-eng
      - name: Install bounded page preparation runtime
        run: python -m pip install -e ./backend "boto3==1.43.93" "pypdfium2==5.13.0" "pillow==12.3.0"
      - name: Freeze pages and audit evidence once
        env:
          SCJ_VISUAL_OUTPUT: ${{ runner.temp }}/prepared
        run: python backend/scripts/scj_principales_visual_benchmark.py
      - name: Preserve common source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-visual-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared/**
          if-no-files-found: error
          retention-days: 90

  judge:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - judge: deepseek-official
            model: deepseek/deepseek-v4.1-flash
            provider: DeepSeek
          - judge: luna-official
            model: openai/gpt-6-luna
            provider: OpenAI
          - judge: ling-vl
            model: inclusionai/ling-3.0-flash-vl
            provider: ""
          - judge: gemini-flash-lite
            model: google/gemini-2.5-flash-lite
            provider: ""
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JURISNEXO_OPENROUTER_VISUAL_MODEL: ${{ matrix.model }}
      SCJ_VISUAL_PROVIDER_ORDER: ${{ matrix.provider }}
      SCJ_VISUAL_REASONING: none
      SCJ_VISUAL_STAGE: run
      SCJ_VISUAL_MAX_CONCURRENCY: ${{ inputs.max_concurrency }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install bounded model runtime
        run: python -m pip install -e ./backend
      - name: Download exact common page evidence
        uses: actions/download-artifact@v4
        with:
          name: scj-visual-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
      - name: Run model on frozen pages
        env:
          SCJ_VISUAL_PREPARED_MANIFEST: ${{ runner.temp }}/prepared/prepared-manifest.json
          SCJ_VISUAL_OUTPUT: ${{ runner.temp }}/model-output
        run: python backend/scripts/scj_principales_visual_benchmark.py
      - name: Publish model summary
        if: always()
        run: test -f "${RUNNER_TEMP}/model-output/summary.md" && cat "${RUNNER_TEMP}/model-output/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Preserve model output and page metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-visual-${{ matrix.judge }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-output/**
          if-no-files-found: warn
          retention-days: 90
