name: SCJ Principales visual benchmark

# Paid/long-running experiment. Ordinary PR synchronization must never spend
# provider credits. The dedicated benchmark-smoke/visual-10 ref runs the bounded
# API/tool-driven smoke; workflow_dispatch remains the configurable manual path.
# Permanent results live under docs/benchmarks/.
on:
  push:
    branches: ["benchmark-smoke/visual-10"]
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Gold pages to benchmark with every LLM after admission"
        required: true
        default: "290"
        type: choice
        options: ["1", "10", "20", "290"]
      alignment_audit_size:
        description: "Candidate pages to audit locally (image OCR vs native PDF text)"
        required: true
        default: "600"
        type: choice
        options: ["20", "100", "600"]
      selection:
        description: "How to select from the eligible page pool"
        required: true
        default: deterministic
        type: choice
        options: [deterministic, random]
      seed:
        description: "Seed used when selection=random"
        required: true
        default: "20260926"
        type: string
      max_concurrency:
        description: "Maximum provider calls in flight per model"
        required: true
        default: "20"
        type: string
      curated_manifest:
        description: "Optional repo-relative curated manifest path"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: scj-principales-visual-benchmark
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ./backend pytest==9.1.1
      - run: pytest -q backend/tests/unit/test_visual_page_benchmark.py backend/tests/unit/test_visual_reference_alignment.py backend/tests/unit/test_visual_reference_ocr.py
      - run: python -m py_compile backend/scripts/scj_principales_visual_benchmark.py backend/scripts/scj_principales_visual_calibration.py

  prepare:
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      SCJ_VISUAL_STAGE: prepare
      SCJ_VISUAL_SAMPLE_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.sample_size || '10' }}
      SCJ_VISUAL_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.selection || 'deterministic' }}
      SCJ_VISUAL_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.seed || '20260926' }}
      SCJ_VISUAL_CURATED_MANIFEST: ${{ github.event_name == 'workflow_dispatch' && inputs.curated_manifest || '' }}
      SCJ_VISUAL_ALIGNMENT_AUDIT_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.alignment_audit_size || '100' }}
      SCJ_VISUAL_MIN_ALIGNMENT_AUDIT_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.alignment_audit_size || '100' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
      - run: python -m pip install -e ./backend "boto3==1.43.93" "pypdfium2==5.13.0" "pillow==12.3.0"
      - name: Freeze calibration evidence and benchmark sample once
        env:
          SCJ_VISUAL_OUTPUT: ${{ runner.temp }}/prepared
        run: python backend/scripts/scj_principales_visual_calibration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scj-visual-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared/**
          if-no-files-found: error
          retention-days: 90

  judge:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {judge: deepseek-official, model: deepseek/deepseek-v4.1-flash, provider: DeepSeek, reasoning: high, free_throttle: false}
          - {judge: ling-3-flash-vl, model: inclusionai/ling-3.0-flash-vl, provider: "", reasoning: high, free_throttle: false}
          - {judge: space-bunny-alpha, model: stealth/space-bunny-alpha, provider: "", reasoning: high, free_throttle: true}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JURISNEXO_OPENROUTER_VISUAL_MODEL: ${{ matrix.model }}
      SCJ_VISUAL_PROVIDER_ORDER: ${{ matrix.provider }}
      SCJ_VISUAL_REASONING: ${{ matrix.reasoning }}
      SCJ_VISUAL_STAGE: run
      SCJ_VISUAL_MAX_CONCURRENCY: ${{ matrix.free_throttle && '1' || (github.event_name == 'workflow_dispatch' && inputs.max_concurrency || '20') }}
      SCJ_VISUAL_REQUEST_INTERVAL_SECONDS: ${{ matrix.free_throttle && '3.1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ./backend
      - uses: actions/download-artifact@v4
        with:
          name: scj-visual-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
      - name: Run model on frozen pages
        env:
          SCJ_VISUAL_PREPARED_MANIFEST: ${{ runner.temp }}/prepared/prepared-manifest.json
          SCJ_VISUAL_OUTPUT: ${{ runner.temp }}/model-output
        run: python backend/scripts/scj_principales_visual_benchmark.py
      - name: Publish model summary
        if: always()
        run: test -f "${RUNNER_TEMP}/model-output/summary.md" && cat "${RUNNER_TEMP}/model-output/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scj-visual-${{ matrix.judge }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-output/**
          if-no-files-found: warn
          retention-days: 90
