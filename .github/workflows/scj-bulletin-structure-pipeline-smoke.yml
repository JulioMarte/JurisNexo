name: SCJ bulletin structure pipeline smoke

on:
  workflow_dispatch:
  push:
    branches:
      - ingestion/structure-agent-adversarial-trace

permissions:
  contents: read

concurrency:
  group: scj-bulletin-structure-pipeline-smoke
  cancel-in-progress: true

env:
  UV_PYTHON: '3.13'
  SOURCE_URL: https://transparencia.poderjudicial.gob.do/documentos/PDF/boletines/1980/FEBRERO.pdf

jobs:
  patch_finalizers:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Apply raw finalizer repair'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch Structure finalizers at raw JSON boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: exact match count={text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          def rx(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: regex match count={count}')
              p.write_text(updated)

          path = 'backend/src/jurisnexo/ingestion/sdk_structure_agent.py'
          exact(path,
              'from agents import Agent, ModelSettings, RunConfig, RunContextWrapper, Runner\nfrom agents.agent import StopAtTools\n',
              'from agents import (\n    Agent,\n    FunctionTool,\n    FunctionToolResult,\n    ModelSettings,\n    RunConfig,\n    RunContextWrapper,\n    Runner,\n)\nfrom agents.agent import ToolsToFinalOutputResult\n')
          exact(path,
              'from agents.models.interface import ModelProvider\n\nfrom jurisnexo.ingestion.document_discovery import DocumentStructureHypothesis\n',
              'from agents.models.interface import ModelProvider\nfrom agents.tool_context import ToolContext\nfrom pydantic import BaseModel, ConfigDict\n\nfrom jurisnexo.ingestion.document_discovery import DocumentStructureHypothesis\n')
          rx(path,
              r'@tool\(failure_error_function=_structure_finalization_error_feedback, strict_mode=True\)\ndef finalize_structure_hypothesis\(.*?\n\n\ndef build_structure_agent',
              '''class _StructureFinalizationArgs(BaseModel):
              model_config = ConfigDict(extra="forbid")

              hypothesis: DocumentStructureHypothesis


          def _finalize_structure_hypothesis_impl(
              ctx: RunContextWrapper[StructureAgentContext], hypothesis: DocumentStructureHypothesis
          ) -> str:
              if ctx.context.finalized_output:
                  raise RuntimeError("structure hypothesis was already finalized")
              validate_index_reference_evidence(
                  hypothesis=hypothesis,
                  environment=ctx.context.environment,
              )
              ctx.context.finalized_output.append(hypothesis)
              rendered = hypothesis.model_dump_json()
              return _trace_success(
                  ctx.context,
                  tool_name="finalize_structure_hypothesis",
                  arguments={"output_type": "DocumentStructureHypothesis"},
                  result=rendered,
              )


          async def _invoke_finalize_structure_hypothesis(
              ctx: ToolContext[StructureAgentContext], input_json: str
          ) -> str:
              if ctx.context.finalized_output:
                  raise RuntimeError("structure hypothesis was already finalized")
              try:
                  parsed = _StructureFinalizationArgs.model_validate_json(input_json)
                  return _finalize_structure_hypothesis_impl(ctx, parsed.hypothesis)
              except ValueError as exc:
                  return _structure_finalization_error_feedback(ctx, exc)


          finalize_structure_hypothesis = FunctionTool(
              name="finalize_structure_hypothesis",
              description=(
                  "Finalize the complete candidate structure after deterministic provenance validation. "
                  "If rejected, repair only this payload and call the tool again."
              ),
              params_json_schema=_StructureFinalizationArgs.model_json_schema(),
              on_invoke_tool=_invoke_finalize_structure_hypothesis,
              strict_json_schema=True,
          )


          def _structure_tool_use_behavior(
              ctx: RunContextWrapper[StructureAgentContext],
              _tool_results: list[FunctionToolResult],
          ) -> ToolsToFinalOutputResult:
              if len(ctx.context.finalized_output) == 1 and isinstance(
                  ctx.context.finalized_output[0], DocumentStructureHypothesis
              ):
                  hypothesis = ctx.context.finalized_output[0]
                  return ToolsToFinalOutputResult(
                      is_final_output=True,
                      final_output=hypothesis.model_dump_json(),
                  )
              return ToolsToFinalOutputResult(is_final_output=False, final_output=None)


          def build_structure_agent''')
          exact(path,
              '        tool_use_behavior=StopAtTools(stop_at_tool_names=["finalize_structure_hypothesis"]),\n',
              '        tool_use_behavior=_structure_tool_use_behavior,\n')

          path = 'backend/src/jurisnexo/ingestion/sdk_structure_auditor.py'
          exact(path,
              'from agents import Agent, ModelSettings, RunConfig, RunContextWrapper, Runner\nfrom agents.agent import StopAtTools\n',
              'from agents import (\n    Agent,\n    FunctionTool,\n    FunctionToolResult,\n    ModelSettings,\n    RunConfig,\n    RunContextWrapper,\n    Runner,\n)\nfrom agents.agent import ToolsToFinalOutputResult\n')
          exact(path,
              'from agents.models.interface import ModelProvider\nfrom pydantic import BaseModel, ConfigDict, Field, model_validator\n',
              'from agents.models.interface import ModelProvider\nfrom agents.tool_context import ToolContext\nfrom pydantic import BaseModel, ConfigDict, Field, model_validator\n')
          rx(path,
              r'@tool\(failure_error_function=_audit_finalization_error_feedback, strict_mode=True\)\ndef finalize_structure_audit\(.*?\n\n\ndef build_structure_auditor',
              '''class _StructureAuditFinalizationArgs(BaseModel):
              model_config = ConfigDict(extra="forbid")

              audit: StructureAuditResult


          def _finalize_structure_audit_impl(
              ctx: RunContextWrapper[StructureAgentContext], audit: StructureAuditResult
          ) -> str:
              if ctx.context.finalized_output:
                  raise RuntimeError("structure audit was already finalized")
              _validate_finding_reviews_against_candidate(
                  audit=audit,
                  candidate_finding_ids=ctx.context.audit_candidate_finding_ids,
              )
              validate_structure_audit_evidence(audit=audit, environment=ctx.context.environment)
              ctx.context.finalized_output.append(audit)
              rendered = audit.model_dump_json()
              ctx.context.trace_recorder.record_success(
                  tool_name="finalize_structure_audit",
                  arguments={"output_type": "StructureAuditResult"},
                  result=rendered,
              )
              ctx.context.tool_budget.observe_success(
                  tool_name="finalize_structure_audit",
                  arguments={"output_type": "StructureAuditResult"},
                  result_char_count=len(rendered),
              )
              return rendered


          async def _invoke_finalize_structure_audit(
              ctx: ToolContext[StructureAgentContext], input_json: str
          ) -> str:
              if ctx.context.finalized_output:
                  raise RuntimeError("structure audit was already finalized")
              try:
                  parsed = _StructureAuditFinalizationArgs.model_validate_json(input_json)
                  return _finalize_structure_audit_impl(ctx, parsed.audit)
              except (ValueError, DocumentEnvironmentError) as exc:
                  return _audit_finalization_error_feedback(ctx, exc)


          finalize_structure_audit = FunctionTool(
              name="finalize_structure_audit",
              description=(
                  "Finalize the adversarial structure audit after deterministic source verification. "
                  "If rejected, repair only this payload and call the tool again."
              ),
              params_json_schema=_StructureAuditFinalizationArgs.model_json_schema(),
              on_invoke_tool=_invoke_finalize_structure_audit,
              strict_json_schema=True,
          )


          def _structure_audit_tool_use_behavior(
              ctx: RunContextWrapper[StructureAgentContext],
              _tool_results: list[FunctionToolResult],
          ) -> ToolsToFinalOutputResult:
              if len(ctx.context.finalized_output) == 1 and isinstance(
                  ctx.context.finalized_output[0], StructureAuditResult
              ):
                  audit = ctx.context.finalized_output[0]
                  return ToolsToFinalOutputResult(
                      is_final_output=True,
                      final_output=audit.model_dump_json(),
                  )
              return ToolsToFinalOutputResult(is_final_output=False, final_output=None)


          def build_structure_auditor''')
          exact(path,
              '        tool_use_behavior=StopAtTools(stop_at_tool_names=["finalize_structure_audit"]),\n',
              '        tool_use_behavior=_structure_audit_tool_use_behavior,\n')

          path = 'backend/tests/unit/test_structure_finalization_repair.py'
          exact(path,
              '    _document_tool_error_feedback,\n    _scope_reminder,\n    _structure_finalization_error_feedback,\n)',
              '    StructureAgentContext,\n    _document_tool_error_feedback,\n    _scope_reminder,\n    _structure_finalization_error_feedback,\n    _structure_tool_use_behavior,\n    finalize_structure_hypothesis,\n)')
          p = Path(path)
          text = p.read_text()
          marker = '\n\ndef test_structure_finalization_repair_is_bounded() -> None:\n'
          if marker not in text:
              raise SystemExit('test marker not found')
          test = '''

          @pytest.mark.asyncio
          async def test_raw_malformed_structure_finalizer_json_is_repairable_before_sdk_parsing() -> None:
              context = StructureAgentContext(environment=DocumentEnvironment(pages=("page one",)))
              wrapper = cast(Any, SimpleNamespace(context=context))

              feedback = await finalize_structure_hypothesis.on_invoke_tool(
                  wrapper,
                  '{"hypothesis":',
              )

              assert "FINALIZATION_REJECTED" in str(feedback)
              assert context.finalized_output == []
              behavior = _structure_tool_use_behavior(wrapper, [])
              assert behavior.is_final_output is False
              assert len(context.finalization_errors) == 1
          '''
          p.write_text(text.replace(marker, test + marker, 1))
          PY
          git diff --check
          git status --short
      - name: Commit raw-finalizer repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JurisNexo CI repair'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/jurisnexo/ingestion/sdk_structure_agent.py backend/src/jurisnexo/ingestion/sdk_structure_auditor.py backend/tests/unit/test_structure_finalization_repair.py
          git commit -m 'Repair raw finalizer JSON handling'
          git push origin HEAD:ingestion/structure-agent-adversarial-trace

  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run one-shot DeepSeek structure smoke'
    name: Investigate and adversarially audit one real SCJ bulletin
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Require model secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}" || { echo 'DEEPSEEK_API_KEY is required' >&2; exit 2; }
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.4
      - name: Install Python
        run: uv python install 3.13
      - name: Install locked backend
        working-directory: backend
        run: uv sync --frozen --group dev
      - name: Acquire one official bulletin and materialize deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ingestion-smoke
          curl --fail --location --show-error --silent \
            --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 600 \
            --connect-timeout 30 --max-time 900 \
            "$SOURCE_URL" -o ingestion-smoke/source.pdf
          test "$(head -c 4 ingestion-smoke/source.pdf)" = '%PDF'
          sha256sum ingestion-smoke/source.pdf | tee ingestion-smoke/sha256.txt
          pdfinfo ingestion-smoke/source.pdf | tee ingestion-smoke/pdfinfo.txt
          pdfimages -list ingestion-smoke/source.pdf | tee ingestion-smoke/pdfimages.txt
          pdftotext -bbox-layout ingestion-smoke/source.pdf ingestion-smoke/bbox-layout.html
      - name: Run Structure Agent then adversarial Structure Auditor
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uv run python ../benchmark/ingestion/run_sdk_structure_pipeline_benchmark.py \
            --bbox ../ingestion-smoke/bbox-layout.html \
            --pdfimages-list ../ingestion-smoke/pdfimages.txt \
            --structure-output ../ingestion-smoke/structure-result.json \
            --audit-output ../ingestion-smoke/structure-audit.json \
            --trace-output ../ingestion-smoke/structure-trace.json \
            --usage-output ../ingestion-smoke/model-usage.json \
            --model-trace-output ../ingestion-smoke/model-observability.jsonl \
            --artifact-label 'Official SCJ Boletín Judicial Núm. 831, Febrero 1980. Find the SUMARIO/index, resolve printed-to-view pagination, document durable structural findings such as source completeness or pagination transforms, identify anomalies, and create one candidate DecisionWorkUnit per indexed decision. Verify representative and anomalous boundaries only; do not extract or exhaustively validate every sentence.' \
            --provider deepseek \
            --model deepseek-v4-flash \
            --structure-max-turns 128 \
            --audit-max-turns 96 \
            --max-reinvestigation-rounds 2
      - name: Score Structure Agent against frozen historical truth
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uv run python ../benchmark/ingestion/evaluate_historical_bulletin_agent.py \
            --result ../ingestion-smoke/structure-result.json \
            --gold ../benchmark/ingestion/gold/historical_bulletin_831_index.v1.json \
            --sha256 ../ingestion-smoke/sha256.txt \
            --output ../ingestion-smoke/structure-score.json
      - name: Enforce adversarial gate and emit summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root = Path('ingestion-smoke')
          result = json.loads((root / 'structure-result.json').read_text())
          audit = json.loads((root / 'structure-audit.json').read_text())
          score = json.loads((root / 'structure-score.json').read_text())
          trace = json.loads((root / 'structure-trace.json').read_text())
          usage = json.loads((root / 'model-usage.json').read_text())
          hypothesis = result.get('hypothesis', {})
          audit_payload = audit.get('audit', {})
          audit_state = audit_payload['state']
          finding_reviews = audit_payload.get('finding_reviews', [])
          finding_review_actions = Counter(review.get('action', 'unknown') for review in finding_reviews)
          approved = audit_state == 'APPROVED' and audit.get('extraction_allowed') is True
          payload = {
              'status': 'PASS' if score.get('status') == 'PASS' and approved else 'FAIL',
              'source_sha256': (root / 'sha256.txt').read_text().split()[0],
              'provider': result.get('provider'), 'model': result.get('model'),
              'artifact_profile': result.get('artifact_profile'), 'document_view': result.get('document_view'),
              'pipeline_round_count': result.get('pipeline_round_count'), 'reinvestigation_exhausted': result.get('reinvestigation_exhausted'),
              'session_usage': usage.get('summary'), 'turn_count': len(usage.get('turns', [])),
              'observability_event_count': usage.get('observability_event_count'), 'structure_tool_calls': result.get('tool_call_count'),
              'decision_work_unit_count': len(hypothesis.get('decision_work_units', [])), 'structure_finding_count': len(hypothesis.get('structure_findings', [])),
              'audit_state': audit_state, 'audit_tool_calls': audit.get('tool_call_count'), 'finding_review_count': len(finding_reviews),
              'finding_review_actions': dict(sorted(finding_review_actions.items())), 'structure_score': score, 'trace_status': trace.get('status'),
              'canonical_commit_performed': False, 'extraction_allowed_by_auditor': approved,
          }
          (root / 'summary.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          if payload['status'] != 'PASS': raise SystemExit(2)
          PY
      - name: Upload investigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-bulletin-structure-pipeline-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ingestion-smoke/sha256.txt
            ingestion-smoke/pdfinfo.txt
            ingestion-smoke/pdfimages.txt
            ingestion-smoke/structure-result.json
            ingestion-smoke/structure-audit.json
            ingestion-smoke/structure-score.json
            ingestion-smoke/structure-trace.json
            ingestion-smoke/structure-trace.jsonl
            ingestion-smoke/model-usage.json
            ingestion-smoke/model-observability.jsonl
            ingestion-smoke/structure-pipeline-error.json
            ingestion-smoke/summary.json
