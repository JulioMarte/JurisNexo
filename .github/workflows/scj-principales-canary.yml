name: SCJ Principales storage canary

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of live Principales PDFs to acquire
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
  push:
    branches:
      - feature/acquisition-run-manifests
    paths:
      - '.github/workflows/scj-principales-canary.yml'
      - 'backend/scripts/scj_principales_canary.py'
      - 'backend/src/jurisnexo/acquisition/**'
      - 'backend/tests/unit/test_official_corpus_acquisition.py'

permissions:
  contents: read

concurrency:
  group: scj-principales-storage-canary
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  canary:
    name: Acquire live SCJ Principales sample
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ vars.JURISNEXO_S3_FORCE_PATH_STYLE || 'true' }}
      SCJ_PRINCIPALES_CANARY_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit || '1' }}
      SCJ_PRINCIPALES_CANARY_OUTPUT: ${{ runner.temp }}/scj-principales-canary
    steps:
      - uses: actions/checkout@v6

      - name: Validate storage configuration without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in JURISNEXO_S3_BUCKET JURISNEXO_S3_ENDPOINT_URL JURISNEXO_S3_REGION JURISNEXO_S3_ACCESS_KEY_ID JURISNEXO_S3_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required S3 secrets: %s\n' "${missing[*]}" >&2
            exit 2
          fi
          printf 'S3 configuration present. bucket=%s region=%s\n' "$JURISNEXO_S3_BUCKET" "$JURISNEXO_S3_REGION"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned acquisition runtime
        run: python -m pip install -e ./backend 'boto3==1.43.93'

      - name: Acquire, verify and manifest live Principales sample
        shell: bash
        run: |
          set -o pipefail
          python backend/scripts/scj_principales_canary.py 2>&1 | tee scj-principales-canary.log

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          echo '## SCJ Principales storage canary' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$SCJ_PRINCIPALES_CANARY_OUTPUT/summary.json" ]]; then
            echo 'Result: PASS. See the uploaded artifact for summary, manifest, inventory, observed HTML and raw log.' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['SCJ_PRINCIPALES_CANARY_OUTPUT']) / 'summary.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          print(f"- discovered: {data['discovered_count']}")
          print(f"- selected: {data['selected_count']}")
          print(f"- new uploads: {data['new_upload_count']}")
          print(f"- already present: {data['already_present_count']}")
          print(f"- manifest: {data['run_manifest_object_key']}")
          PY
          elif [[ -f "$SCJ_PRINCIPALES_CANARY_OUTPUT/failure.json" ]]; then
            echo 'Result: FAIL. Full traceback and observed source HTML are in the uploaded artifact.' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['SCJ_PRINCIPALES_CANARY_OUTPUT']) / 'failure.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          print(f"- error_type: {data.get('error_type', 'unknown')}")
          print(f"- error: {data.get('error', 'unknown')}")
          PY
          else
            echo 'No structured result was produced; inspect the raw log artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve source observation, manifest and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scj-principales-canary-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/scj-principales-canary/**
            scj-principales-canary.log
