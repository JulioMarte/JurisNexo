name: SCJ pilot corpus profile

on:
  workflow_dispatch:
  push:
    branches:
      - benchmark/scj-pilot-profiler
      - feature/scj-layout-parser
      - benchmark/scj-gold-dataset-v1
    paths:
      - "benchmark/ingestion/**"
      - "backend/src/jurisnexo/ingestion/**"
      - "backend/tests/unit/test_scj_*.py"
      - ".github/workflows/scj-pilot-profile.yml"

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 2023-enero-abril
            file_path: Suprema Corte PDF/Principales_decisiones_enero-abril_2023.pdf
          - id: 2023-mayo-agosto
            file_path: Suprema Corte PDF/Principales_Decisiones_mayo_agosto_2023.pdf
          - id: 2023-septiembre-diciembre
            file_path: Suprema Corte PDF/Principales-Decisiones_Septiembre-Diciembre_2023.pdf
          - id: 2024-enero-abril
            file_path: Suprema Corte PDF/Principales_Decisiones_enero_abril_2024.pdf
          - id: 2024-mayo-agosto
            file_path: Suprema Corte PDF/Principales_Decisiones_mayo_agosto_2024.pdf
          - id: 2024-septiembre-diciembre
            file_path: Suprema Corte PDF/Principales-Decisiones-septiembre-diciembre-2024.pdf
          - id: 2025-enero-abril
            file_path: Suprema Corte PDF/Principales_Decisiones_enero_abril_2025.pdf
          - id: 2025-mayo-agosto
            source_url: https://poderjudicial.gob.do/wp-content/uploads/2025/10/Principales_Decisiones_2025_Mayo-Agosto.pdf
          - id: 2025-septiembre-diciembre
            source_url: https://poderjudicial.gob.do/wp-content/uploads/2026/01/Principales-Decisiones-septiembre-diciembre.pdf
    env:
      CORPUS_ID: ${{ matrix.id }}
      FILE_PATH: ${{ matrix.file_path }}
      SOURCE_URL: ${{ matrix.source_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.4"
      - name: Install locked backend environment
        working-directory: backend
        run: uv sync --frozen --group dev
      - name: Download immutable benchmark input
        run: |
          mkdir -p benchmark-output
          if [ -n "${SOURCE_URL:-}" ]; then
            ORIGIN="$SOURCE_URL"
            curl --fail --location --retry 3 \
              --user-agent "JurisNexo-benchmark/1.0" \
              "$SOURCE_URL" \
              --output "benchmark-output/${CORPUS_ID}.pdf"
          else
            ENCODED_PATH=$(python - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['FILE_PATH'], safe='/'))
          PY
            )
            ORIGIN="https://xkmfwfupskqcmeetdwbv.supabase.co/storage/v1/object/public/docs-sentencia/${ENCODED_PATH}"
            curl --fail --location --retry 3 \
              "$ORIGIN" \
              --output "benchmark-output/${CORPUS_ID}.pdf"
          fi
          echo "SOURCE_ORIGIN=$ORIGIN" >> "$GITHUB_ENV"
      - name: Preserve page-separated extracted text for review
        run: |
          pdftotext -layout -enc UTF-8 \
            "benchmark-output/${CORPUS_ID}.pdf" \
            "benchmark-output/${CORPUS_ID}.txt"
      - name: Profile production parser coverage and create review sample
        env:
          PYTHONPATH: backend/src
        run: |
          backend/.venv/bin/python benchmark/ingestion/run_scj_pilot_profiler.py \
            "benchmark-output/${CORPUS_ID}.pdf" \
            --source-origin "$SOURCE_ORIGIN" \
            --report "benchmark-output/${CORPUS_ID}-profile.json" \
            --review-sample "benchmark-output/${CORPUS_ID}-review.jsonl" \
            --review-limit 100 \
            --require-declared-count-match
      - name: Upload reproducible pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: scj-pilot-${{ matrix.id }}
          path: |
            benchmark-output/${{ matrix.id }}-profile.json
            benchmark-output/${{ matrix.id }}-review.jsonl
            benchmark-output/${{ matrix.id }}.txt
          if-no-files-found: error

  build-review-queue:
    name: Build stratified gold review queue
    needs: profile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download all profiler evidence
        uses: actions/download-artifact@v4
        with:
          pattern: scj-pilot-*
          path: benchmark-input
          merge-multiple: true
      - name: Build deterministic pending-review queue
        run: |
          python benchmark/ingestion/build_scj_gold_review_queue.py \
            --input-dir benchmark-input \
            --output benchmark-output/scj-gold-review-queue-v1.jsonl \
            --manifest benchmark-output/scj-gold-review-queue-v1-manifest.json \
            --target 80
      - name: Upload pending review queue
        uses: actions/upload-artifact@v4
        with:
          name: scj-gold-review-queue-v1
          path: |
            benchmark-output/scj-gold-review-queue-v1.jsonl
            benchmark-output/scj-gold-review-queue-v1-manifest.json
          if-no-files-found: error
