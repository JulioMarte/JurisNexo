name: Ops S3 checksum framing probe

on:
  push:
    branches:
      - ops/s3-addressing-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: 'true'
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e ./backend 'boto3==1.43.93'
      - name: Inspect framing and write smoke object
        run: |
          python - <<'PY'
          from jurisnexo.acquisition.s3_object_store import S3RuntimeSettings, create_boto3_s3_client

          settings = S3RuntimeSettings()
          client = create_boto3_s3_client(settings)
          safe_names = {
              "content-length",
              "content-encoding",
              "transfer-encoding",
              "expect",
              "x-amz-sdk-checksum-algorithm",
              "x-amz-trailer",
              "x-amz-content-sha256",
          }

          def inspect(request, **kwargs):
              headers = {}
              for key, value in request.headers.items():
                  name = str(key).lower()
                  if name in safe_names:
                      headers[name] = str(value)
              print("SAFE_PUT_HEADERS", headers, flush=True)

          client.meta.events.register("before-send.s3.PutObject", inspect)
          key = "_system/probes/checksum-when-required.txt"
          client.put_object(
              Bucket=settings.bucket,
              Key=key,
              Body=b"checksum-probe\n",
              ContentType="text/plain",
              Metadata={"jurisnexo-purpose": "checksum-probe"},
          )
          head = client.head_object(Bucket=settings.bucket, Key=key)
          print("PUT_OK", head.get("ContentLength"), flush=True)
          try:
              client.delete_object(Bucket=settings.bucket, Key=key)
          except Exception:
              pass
          PY
