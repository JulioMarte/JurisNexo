name: Ops S3 corpus inventory probe

on:
  push:
    branches:
      - ops/s3-addressing-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: 'true'
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e ./backend 'boto3==1.43.93'
      - name: Read-only SCJ storage inventory
        run: |
          python - <<'PY'
          import json
          from jurisnexo.acquisition.s3_object_store import S3RuntimeSettings, create_boto3_s3_client

          settings = S3RuntimeSettings()
          client = create_boto3_s3_client(settings)
          prefix = "jurisdictions/do/scj/decisions/"
          count = 0
          size = 0
          token = None
          while True:
              kwargs = {"Bucket": settings.bucket, "Prefix": prefix, "MaxKeys": 1000}
              if token:
                  kwargs["ContinuationToken"] = token
              response = client.list_objects_v2(**kwargs)
              for item in response.get("Contents", []):
                  count += 1
                  size += int(item.get("Size") or 0)
              if not response.get("IsTruncated"):
                  break
              token = response.get("NextContinuationToken")
              if not token:
                  raise RuntimeError("truncated listing without continuation token")
          print(json.dumps({
              "prefix": prefix,
              "object_count": count,
              "total_bytes": size,
              "total_gib": round(size / (1024**3), 3),
          }, sort_keys=True))
          PY
