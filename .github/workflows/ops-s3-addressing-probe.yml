name: Ops S3 addressing probe

on:
  push:
    branches:
      - ops/s3-addressing-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        path_style: ['true', 'false']
    env:
      JURISNEXO_S3_BUCKET: ${{ secrets.JURISNEXO_S3_BUCKET }}
      JURISNEXO_S3_ENDPOINT_URL: ${{ secrets.JURISNEXO_S3_ENDPOINT_URL }}
      JURISNEXO_S3_REGION: ${{ secrets.JURISNEXO_S3_REGION }}
      JURISNEXO_S3_ACCESS_KEY_ID: ${{ secrets.JURISNEXO_S3_ACCESS_KEY_ID }}
      JURISNEXO_S3_SECRET_ACCESS_KEY: ${{ secrets.JURISNEXO_S3_SECRET_ACCESS_KEY }}
      JURISNEXO_S3_FORCE_PATH_STYLE: ${{ matrix.path_style }}
      JURISNEXO_S3_SMOKE_ATTEMPTS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e ./backend 'boto3==1.43.93'
      - name: Run S3 smoke
        env:
          JURISNEXO_S3_SMOKE_RUN_ID: addressing-${{ matrix.path_style }}-${{ github.run_id }}
        run: python -m jurisnexo.acquisition.s3_smoke
