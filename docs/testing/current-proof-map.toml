schema_version = 1
status = "review-current-proof-map"
normative = false
guarantees = "docs/testing/current-guarantees.toml"

# Review/migration evidence, not a constitution of test filenames.
# current-guarantees.toml remains normative. Representative proof paths may move
# or be replaced as long as equal-or-stronger evidence protects the guarantee.
# Every current guarantee must be represented by proof, an explicit gap, or both.

[[proofs]]
guarantee = "INV-SOURCE-PROVENANCE-001"
path = "backend/tests/integration/test_source_document_inventory.py"
evidence = ["invariant", "provenance"]

[[proofs]]
guarantee = "INV-SOURCE-PROVENANCE-001"
path = "backend/tests/integration/test_artifact_catalog.py"
evidence = ["invariant", "provenance"]

[[gaps]]
guarantee = "INV-SOURCE-PROVENANCE-001"
missing_evidence = ["adversarial"]
reason = "Current provenance tests establish durable source/artifact identity, but the inventory still requires a stronger adversarial proof that source truth cannot be silently substituted or rewritten across the supported ingestion path."

