risk = ["architecture", "legal_quality"]

[[guarantees]]
id = "FIT-BRANCH-WORKFLOW-001"
statement = "development is the canonical integration branch and main is release-only; ordinary work enters development through short-lived PR branches, exact-head CI is the merge gate, development promotes to main only through a release PR, and same-repository work branches are deleted only after successful merge."
