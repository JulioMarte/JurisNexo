classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-JUDICIAL-PARTIAL-STANCE-001"
statement = "A judicial officer may hold multiple scoped positions within one decision, including concurrence on one issue and dissent on another; every stance must belong to that same officer and decision and a coarse vote summary is not canonical truth."
