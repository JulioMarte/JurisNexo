schema_version = 1
status = "normative-current-guarantee-inventory"
policy = "docs/22-architecture-fitness-functions.md"

# This inventory names durable guarantees, not exact test filenames or incidental
# repository shape. Tests may move or be replaced as long as the protected
# guarantee keeps equivalent or stronger evidence.

[[guarantees]]
id = "INV-SOURCE-PROVENANCE-001"
statement = "Primary legal source artifacts remain identifiable by immutable/versioned provenance, including stable artifact identity and checksum, and model interpretation cannot silently rewrite source truth."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-EVIDENCE-TRACE-001"
statement = "Material extracted or researched legal claims remain traceable to typed evidence that identifies the source artifact and observed page/passage; source-reference evidence and observed-content evidence remain distinguishishable."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-CANONICAL-COMMIT-001"
statement = "Model outputs are candidate observations or analyses until the required deterministic and audit gates approve canonical persistence; agent output alone cannot become canonical legal truth."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-LEGAL-IDENTITY-001"
statement = "The corpus keeps litigation controversy, court-specific proceeding, procedural event and judicial decision as distinct legal identities; grouping one into another requires explicit persisted relations rather than inferred table-name semantics."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-JUDICIAL-DECISION-PHYSICAL-001"
statement = "The canonical physical identity for one judicial decision is corpus.judicial_decisions; the historical compatibility alias corpus.cases is absent from the canonical schema and must not be reintroduced as a persistence or compatibility surface."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "fitness"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-PROPOSITION-EPISTEMICS-001"
statement = "Legal propositions retain whether they are explicit source text, derived structure, synthesized interpretation or human-authored analysis, and verification never silently converts interpretation into primary-source fact."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-PROPOSITION-SUBJECT-001"
statement = "A proposition used in a judicial treatment is explicitly bound to its actual legal subject; source and target propositions cannot be borrowed from unrelated decisions merely because they share a corpus scope."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-PROVISION-HIERARCHY-001"
statement = "Provision identity respects hierarchical source structure: repeated child labels under different parents are valid, while duplicate normalized sibling labels within the same document/parent are rejected."
severity = "high"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-LEGAL-TEMPORAL-IDENTITY-001"
statement = "Normative legal instruments, their temporal versions, stable provisions, provision versions, source documents and amending instruments remain distinct identities; historical text changes never overwrite source history or collapse an amending law into the law it changes."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality", "architecture"]

[[guarantees]]
id = "INV-BITEMPORAL-KNOWLEDGE-001"
statement = "Legal validity time and JurisNexo knowledge/system time remain independently queryable; later corrections append non-overlapping knowledge history and cannot rewrite what the system knew at an earlier time."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality", "architecture"]

[[guarantees]]
id = "INV-BITEMPORAL-ASSERTIONS-001"
statement = "Mutable legal conclusions such as norms, structural relation assertions, judicial treatments, precedent authority and decision legal-status assertions carry system-knowledge time in addition to their legal-valid/event time; immutable proposition text is corrected by superseding claims rather than destructive mutation."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality", "architecture"]

[[guarantees]]
id = "INV-LEGAL-NORM-EPISTEMICS-001"
statement = "A synthesized legal requirement is persisted as an evidenced norm assertion over a proposition, not as fictitious promulgated canonical text; verified norm assertions require verified legal-source support."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-LEGAL-RELATION-HISTORY-001"
statement = "Structural legal relations separate stable source/type/target identity from time-bounded, knowledge-bounded verified assertions and assertion-specific evidence."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality", "architecture"]

[[guarantees]]
id = "INV-LEGAL-TAXONOMY-DAG-001"
statement = "Matter and procedure classifications support multiple broader concepts while hierarchical cycles are rejected; canonical classification is a DAG rather than a single-parent tree."
severity = "high"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-EXTENSIBLE-ROLE-DISPOSITION-001"
statement = "Canonical procedural roles and judicial disposition meanings use extensible concept identities rather than closed persisted text enums; a disposition clause contains canonical actions, each action owns one effect concept, typed semantic arguments reference that action, and exact source wording remains separate provenance."
severity = "high"
classification = "HARD"
required_evidence = ["invariant", "integration"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-PARTY-ROLE-REPRESENTATION-001"
statement = "Party identity, procedural role and legal representation are distinct persisted identities; raw source role wording cannot substitute for canonical party-role or representative relationships."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-JUDICIAL-STANCE-001"
statement = "Judicial officer identity, temporal court position, panel membership, vote and authored/joined opinion remain distinct; dissent or concurrence is never encoded merely as panel membership."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-JUDICIAL-OPINION-PANEL-001"
statement = "An officer may author or join a judicial opinion only when that officer belongs to the panel for the same judicial decision."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-DECISION-LEGAL-STATUS-001"
statement = "A judicial decision's legal status and finality are temporal legal facts independent from corpus extraction, verification or review quality."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-COURT-COMPETENCE-001"
statement = "Court territorial, subject-matter and functional/instance competence are independent persisted legal dimensions and are not collapsed into one overloaded jurisdiction string."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-CONTEXTUAL-AUTHORITY-001"
statement = "Binding or persuasive authority is represented as a contextual, evidenced assertion over jurisdiction, court, subject and time; the corpus never assigns a global authority score or timeless binding label to a decision."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality"]

[[guarantees]]
id = "INV-CONTEXTUAL-TREATMENT-001"
statement = "Substantive judicial treatments such as follows, distinguishes, applies, overrules or conflicts_with require issue/proposition context and cannot be promoted as timeless global document relations."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-TREATMENT-EVIDENCE-001"
statement = "Verified substantive judicial treatment requires source-decision evidence; treatment evidence and any source/target proposition references must be consistent with the judicial decisions named by the assertion."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-AMENDMENT-RECONSTRUCTION-001"
statement = "Provision renumbering, continuation, split/merge lineage and character-level amendment operations remain explicit and traceable to a specific target provision version rather than being inferred by destructive text replacement."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-LEGAL-AUTHORITY-IDENTITY-001"
statement = "Issuing, promulgating, publishing and administering institutions have normalized authority identities and typed roles while preserving source-native wording separately."
severity = "high"
classification = "HARD"
required_evidence = ["invariant", "integration"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-INGESTION-GATES-001"
statement = "Canonical agent-assisted ingestion preserves the mandatory Structure -> Structure Audit -> Extraction -> Extraction Audit -> commit ordering, and dynamic handoffs cannot bypass those business gates."
severity = "critical"
classification = "HARD"
required_evidence = ["contract", "integration", "adversarial"]
risk = ["architecture", "provenance", "legal_quality"]

[[guarantees]]
id = "INV-AGENT-DATA-ACCESS-001"
statement = "Agents and model runtimes do not receive unrestricted SQL or production database credentials; legal corpus access crosses explicit Document Workspace or Corpus API capabilities with deterministic authorization and validation."
severity = "critical"
