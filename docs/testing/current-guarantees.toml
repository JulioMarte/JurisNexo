schema_version = 1
status = "normative-current-guarantee-inventory"
policy = "docs/22-architecture-fitness-functions.md"

# This inventory names durable guarantees, not exact test filenames or incidental
# repository shape. Tests may move or be replaced as long as the protected
# guarantee keeps equivalent or stronger evidence.

[[guarantees]]
id = "INV-SOURCE-PROVENANCE-001"
statement = "Primary legal source artifacts remain identifiable by immutable/versioned provenance, including stable artifact identity and checksum, and model interpretation cannot silently rewrite source truth."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-EVIDENCE-TRACE-001"
statement = "Material extracted or researched legal claims remain traceable to typed evidence that identifies the source artifact and observed page/passage; source-reference evidence and observed-content evidence remain distinguishishable."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "contract", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-CANONICAL-COMMIT-001"
statement = "Model outputs are candidate observations or analyses until the required deterministic and audit gates approve canonical persistence; agent output alone cannot become canonical legal truth."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-LEGAL-IDENTITY-001"
statement = "The corpus keeps litigation controversy, court-specific proceeding, procedural event and judicial decision as distinct legal identities; grouping one into another requires explicit persisted relations rather than inferred table-name semantics."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-JUDICIAL-DECISION-PHYSICAL-001"
statement = "The canonical physical identity for one judicial decision is corpus.judicial_decisions; the historical name corpus.cases is compatibility-only and must not become the persistence contract for new code."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "fitness"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-PROPOSITION-EPISTEMICS-001"
statement = "Legal propositions retain whether they are explicit source text, derived structure, synthesized interpretation or human-authored analysis, and verification never silently converts interpretation into primary-source fact."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-PROPOSITION-SUBJECT-001"
statement = "A proposition used in a judicial treatment is explicitly bound to its actual legal subject; source and target propositions cannot be borrowed from unrelated decisions merely because they share a corpus scope."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-PROVISION-HIERARCHY-001"
statement = "Provision identity respects hierarchical source structure: repeated child labels under different parents are valid, while duplicate normalized sibling labels within the same document/parent are rejected."
severity = "high"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-LEGAL-TEMPORAL-IDENTITY-001"
statement = "Normative legal instruments, their temporal versions, stable provisions, provision versions, source documents and amending instruments remain distinct identities; historical text changes never overwrite source history or collapse an amending law into the law it changes."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality", "architecture"]

[[guarantees]]
id = "INV-BITEMPORAL-KNOWLEDGE-001"
statement = "Legal validity time and JurisNexo knowledge/system time remain independently queryable; later corrections append non-overlapping knowledge history and cannot rewrite what the system knew at an earlier time."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality", "architecture"]

[[guarantees]]
id = "INV-BITEMPORAL-ASSERTIONS-001"
statement = "Mutable legal conclusions such as norms, structural relation assertions, judicial treatments, judicial authority effects and decision legal-status assertions carry system-knowledge time in addition to their legal-valid/event time; immutable proposition text is corrected by superseding claims rather than destructive mutation."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality", "architecture"]

[[guarantees]]
id = "INV-LEGAL-NORM-EPISTEMICS-001"
statement = "A synthesized legal requirement is persisted as an evidenced norm assertion over a proposition, not as fictitious promulgated canonical text; verified norm assertions require verified legal-source support."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality"]

[[guarantees]]
id = "INV-LEGAL-RELATION-HISTORY-001"
statement = "Structural legal relations separate stable source/type/target identity from time-bounded, knowledge-bounded verified assertions and assertion-specific evidence."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["provenance", "legal_quality", "architecture"]

[[guarantees]]
id = "INV-LEGAL-TAXONOMY-DAG-001"
statement = "Matter and procedure classifications support multiple broader concepts while hierarchical cycles are rejected; canonical classification is a DAG rather than a single-parent tree."
severity = "high"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-EXTENSIBLE-ROLE-DISPOSITION-001"
statement = "Canonical procedural roles and judicial disposition meanings use extensible concept identities rather than closed persisted text enums; exact source wording remains separate provenance."
severity = "high"
classification = "HARD"
required_evidence = ["invariant", "integration"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-PARTY-ROLE-REPRESENTATION-001"
statement = "Party identity, procedural role and legal representation are distinct persisted identities; raw source role wording cannot substitute for canonical party-role or representative relationships."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-JUDICIAL-STANCE-001"
statement = "Judicial officer identity, temporal court position, panel membership, vote and authored/joined opinion remain distinct; dissent or concurrence is never encoded merely as panel membership."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-JUDICIAL-OPINION-PANEL-001"
statement = "An officer may author or join a judicial opinion only when that officer belongs to the panel for the same judicial decision."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-DECISION-LEGAL-STATUS-001"
statement = "A judicial decision's legal status and finality are temporal legal facts independent from corpus extraction, verification or review quality."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-COURT-COMPETENCE-001"
statement = "Court territorial, subject-matter and functional/instance competence are independent persisted legal dimensions and are not collapsed into one overloaded jurisdiction string."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-CONTEXTUAL-AUTHORITY-001"
statement = "Judicial authority effect is represented as a contextual, evidenced and jurisdiction-extensible concept assertion over jurisdiction, court, subject and time; the corpus never assigns a global authority score or timeless binding label, and common-law seed labels are not treated as a universal ontology."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-CONTEXTUAL-TREATMENT-001"
statement = "Substantive judicial treatments such as follows, distinguishes, applies, overrules or conflicts_with require issue/proposition context and cannot be promoted as timeless global document relations."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-TREATMENT-EVIDENCE-001"
statement = "Verified substantive judicial treatment requires source-decision evidence; treatment evidence and any source/target proposition references must be consistent with the judicial decisions named by the assertion."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-AMENDMENT-RECONSTRUCTION-001"
statement = "Provision renumbering, continuation, split/merge lineage and character-level amendment operations remain explicit and traceable to a specific target provision version rather than being inferred by destructive text replacement."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-LEGAL-AUTHORITY-IDENTITY-001"
statement = "Issuing, promulgating, publishing and administering institutions have normalized authority identities and typed roles while preserving source-native wording separately."
severity = "high"
classification = "HARD"
required_evidence = ["invariant", "integration"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-INGESTION-GATES-001"
statement = "Canonical agent-assisted ingestion preserves the mandatory Structure -> Structure Audit -> Extraction -> Extraction Audit -> commit ordering, and dynamic handoffs cannot bypass those business gates."
severity = "critical"
classification = "HARD"
required_evidence = ["contract", "integration", "adversarial"]
risk = ["architecture", "provenance", "legal_quality"]

[[guarantees]]
id = "INV-AGENT-DATA-ACCESS-001"
statement = "Agents and model runtimes do not receive unrestricted SQL or production database credentials; legal corpus access crosses explicit Document Workspace or Corpus API capabilities with deterministic authorization and validation."
severity = "critical"
classification = "HARD"
required_evidence = ["fitness", "security", "adversarial"]
risk = ["security", "architecture"]

[[guarantees]]
id = "INV-TENANT-001"
statement = "Private tenant-scoped corpus, uploads, jobs, evidence and reports cannot be observed or mutated across organization boundaries through supported runtime surfaces."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "security", "adversarial"]
risk = ["security"]

[[guarantees]]
id = "INV-RUNTIME-REPLACEABILITY-001"
statement = "The agent runtime and provider SDKs remain infrastructure adapters rather than the legal system of record; durable corpus/evidence contracts do not persist framework-specific runtime objects as authoritative data."
severity = "critical"
classification = "CONTROLLED"
required_evidence = ["fitness", "contract"]
risk = ["architecture", "provenance"]

[[guarantees]]
id = "INV-RESEARCH-VERIFICATION-001"
statement = "Material legal research requires supporting and adverse-authority investigation and claim/evidence verification before a result is represented as a verified report; runtime success alone is insufficient."
severity = "critical"
classification = "HARD"
required_evidence = ["benchmark", "contract", "adversarial"]
risk = ["legal_quality"]

[[guarantees]]
id = "INV-REPRODUCIBILITY-001"
statement = "Completed ingestion and research outputs retain enough source, corpus, model/provider, prompt/configuration, evidence and job-state metadata to diagnose and materially reproduce the run without requiring hidden chain-of-thought."
severity = "high"
classification = "HARD"
required_evidence = ["invariant", "contract"]
risk = ["provenance", "operations"]

[[guarantees]]
id = "INV-BENCHMARK-INDEPENDENCE-001"
statement = "Benchmarks preserve independent frozen inputs/gold where applicable, do not leak answers into agent prompts/tools, distinguish runtime/navigation/semantic status, and do not weaken scorers merely to make a candidate implementation pass."
severity = "critical"
classification = "HARD"
required_evidence = ["benchmark", "fitness", "adversarial"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "FIT-ARCH-BOUNDARY-001"
statement = "Agent/runtime, provider, persistence and HTTP concerns cross explicit supported boundaries; agent-like modules do not gain direct database authority and provider contracts remain independent from concrete provider implementations."
severity = "critical"
classification = "HARD"
required_evidence = ["fitness"]
risk = ["architecture", "security"]

[[guarantees]]
id = "FIT-REPO-GOVERNANCE-001"
statement = "Repository documentation, AGENTS instructions, architecture guarantee inventory, fitness functions and CI preserve one discoverable source-of-truth hierarchy without freezing incidental file layout as permanent architecture."
severity = "critical"
classification = "CONTROLLED"
required_evidence = ["fitness"]
risk = ["architecture"]

[[guarantees]]
id = "FIT-BRANCH-WORKFLOW-001"
statement = "main remains the canonical integration branch; normal work enters through short-lived PR branches, current-head CI is the merge gate, and same-repository branches are deleted only after successful merge."
severity = "critical"
classification = "CONTROLLED"
required_evidence = ["fitness"]
risk = ["architecture", "operations"]

[[guarantees]]
id = "INV-PROPOSITION-SUBJECT-CARDINALITY-001"
statement = "One legal proposition may bind to multiple legal subjects of the same type; subject cardinality must not collapse multi-provision, multi-decision, multi-document or multi-proceeding legal claims into a false singularity."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-JUDICIAL-PARTIAL-STANCE-001"
statement = "A judicial officer may hold multiple scoped positions within one decision, including concurrence on one issue and dissent on another; every stance must belong to that same officer and decision and a coarse vote summary is not canonical truth."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-NORM-CLAIM-CONTEXT-001"
statement = "Legal norm identity is contextual rather than proposition-text-only: jurisdiction, norm kind, legal matter and validity interval may distinguish claims sharing the same proposition, while bitemporal knowledge overlap is rejected per norm claim identity."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "architecture", "provenance"]

[[guarantees]]
id = "INV-CLAIM-DISPOSITION-MEMBERSHIP-001"
statement = "A judicial disposition cannot canonically resolve a claim or appeal ground from a proceeding unrelated to that judicial decision; claim-to-disposition effects require explicit proceeding membership."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-COMMON-LEGAL-ENTITY-001"
statement = "A real person or institution may have multiple legal-role specializations that share one scope-consistent legal entity identity; normalized-name similarity alone never proves entity identity."
severity = "high"
classification = "HARD"
required_evidence = ["invariant", "integration"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-DECISION-STATE-EVENT-001"
statement = "Point-in-time judicial lifecycle events and durative legal states are distinct persisted facts; durative states retain legal-validity time and non-overlapping system-knowledge history."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance", "architecture"]

[[guarantees]]
id = "INV-COMPAT-CANONICAL-SYNC-001"
statement = "Writes through singular compatibility fields promote into normalized canonical relations without leaving stale compatibility-originated primary facts or deleting independently verified richer relations."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "architecture"]

[[guarantees]]
id = "INV-CLAIM-PROCEEDING-CONTEXT-001"
statement = "A legal claim, its parent claim and its asserting procedural party role belong to the same proceeding; same-scope identity alone is insufficient to establish procedural membership."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "provenance"]

[[guarantees]]
id = "INV-EXTENSIBLE-JUDICIAL-SEMANTICS-001"
statement = "Canonical judicial opinion types and scoped judicial stances use extensible concept identities; compatibility text codes are deterministic mirrors and jurisdiction-specific concepts do not require schema migrations or replacement of source-native wording."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "architecture", "provenance"]

[[guarantees]]
id = "INV-DISPOSITION-TARGET-CARDINALITY-001"
statement = "A dispositive clause may target multiple typed legal identities including claims, procedural party roles, proceedings, judicial decisions and propositions; each target is explicit, procedural-context membership is enforced where applicable, and singular legacy target fields cannot create stale canonical double truth."
severity = "critical"
classification = "HARD"
required_evidence = ["invariant", "integration", "adversarial"]
risk = ["legal_quality", "architecture", "provenance"]
