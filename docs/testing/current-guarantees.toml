risk = ["architecture"]

[[guarantees]]
id = "FIT-TEST-EVIDENCE-001"
statement = "Durable tests are authored as falsifiable evidence for explicit guarantees and plausible defects; test organization and instruction adapters preserve evidence integrity without freezing incidental test filenames, counts, helpers, or private implementation shape."
