severity = "high"
classification = "CONTROLLED"
required_evidence = ["fitness"]
risk = ["architecture"]

[[guarantees]]
id = "INV-PROPOSITION-SUBJECT-CARDINALITY-001"
statement = "One legal proposition may bind to multiple legal subjects of the same type; subject cardinality must not collapse multi-provision, multi-decision, multi-document or multi-proceeding legal claims into a false singularity."
